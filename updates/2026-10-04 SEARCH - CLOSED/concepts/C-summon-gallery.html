<!--
  C-summon-gallery.html — SEARCH concept: Summon bar + stacked chips ATOP the Home flask gallery.

  Rationale / decisions:
  - Search is not a separate screen. It lives on top of the real Home gallery so the mental
    model stays "this is my shelf of flasks, now narrowed". The TIMELINE grouping (date buckets
    on a quiet left rail) is preserved through every filter — only empty buckets collapse away.
  - Live, local, instant: every keystroke re-filters the in-memory gallery. Non-matching flasks
    dissolve (fade + scale + blur) then leave the flow so buckets re-flow; matches settle in with
    a soft glow/pop. A "n / N" count sits in the bar.
  - WHY it matched is always shown: a title hit highlights the title, a tag hit highlights that
    tag pill, and a BODY hit reveals a one-line context snippet with the term highlighted, plus a
    tiny reason label. Highlights use a subtle accent wash, never a loud colour.
  - Filters stack as chips under the bar (seeded: a tag chip + a date chip), ANDed across facets.
    Clicking a card's tag adds a chip, so stacking is demonstrable. Chips narrow the same gallery.
  - Magic is calm: a faint silver mist drifts behind the gallery; the focused bar gets a gentle
    halo. Practicality is the hero — fast, legible, one accent.
  - Keyboard: "/" focuses the bar; Esc clears the query AND all chips, restoring every flask.

  Left for the real build: true importance/recency ranking (here matches keep their timeline
  order rather than re-sorting by score), fuzzy/stemmed matching, real date math for buckets,
  and wiring to the SQLite index instead of mock notes.
-->
<meta charset="utf-8" />
<title>Pensieve — Summon the gallery</title>
<style>
  :root {
    --surface: 222 24% 11%;
    --surface-sunken: 222 22% 13%;
    --surface-raised: 222 18% 17%;
    --text: 216 18% 84%;
    --text-muted: 218 12% 60%;
    --border: 222 16% 21%;
    --accent: 215 85% 74%;
    --accent-glow: 218 100% 72%;
    --radius: 6px;

    --cat-orange: 24 85% 68%;
    --cat-gray: 220 10% 72%;
    --cat-green: 145 50% 62%;
    --cat-blue: 210 80% 70%;
    --cat-purple: 265 60% 74%;
    --cat-pink: 330 70% 74%;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
    background: hsl(var(--surface));
    color: hsl(var(--text));
    -webkit-font-smoothing: antialiased;
  }

  /* ---- faint silver mist drifting behind everything ---- */
  .mist { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .mist span {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at center, hsl(210 30% 80% / 0.05), transparent 70%);
    filter: blur(6px);
  }
  .mist .m1 { width: 60vw; height: 60vw; left: -10vw; top: -20vw; animation: drift1 48s ease-in-out infinite; }
  .mist .m2 { width: 45vw; height: 45vw; right: -8vw; top: 20vh; animation: drift2 62s ease-in-out infinite; }
  .mist .m3 { width: 40vw; height: 40vw; left: 25vw; bottom: -18vw; animation: drift1 54s ease-in-out infinite reverse; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vw,4vh) scale(1.12); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-5vw,-5vh) scale(0.95); } }

  /* ---- shell ---- */
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }

  /* ---- Summon bar (pinned) ---- */
  .top {
    position: sticky; top: 0; z-index: 5;
    padding: 20px 28px 14px;
    background: linear-gradient(hsl(var(--surface)) 72%, hsl(var(--surface) / 0));
  }
  .bar-wrap { max-width: 1120px; margin: 0 auto; }
  .bar {
    display: flex; align-items: center; gap: 10px;
    background: hsl(var(--surface-sunken));
    border: 1px solid hsl(var(--border));
    border-radius: 10px;
    padding: 0 14px; height: 48px;
    transition: box-shadow .25s ease, border-color .25s ease;
  }
  .bar:focus-within {
    border-color: hsl(var(--accent) / 0.55);
    box-shadow: 0 0 0 1px hsl(var(--accent) / 0.25),
                0 0 26px hsl(var(--accent-glow) / 0.22),
                0 0 60px hsl(var(--accent-glow) / 0.10);
  }
  .bar svg.lens { flex: none; color: hsl(var(--text-muted)); }
  .bar:focus-within svg.lens { color: hsl(var(--accent)); }
  .bar input {
    flex: 1; background: none; border: 0; outline: 0;
    color: hsl(var(--text)); font-size: 15px; height: 100%;
  }
  .bar input::placeholder { color: hsl(var(--text-muted)); }
  .count {
    flex: none; font-size: 12px; color: hsl(var(--text-muted));
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    padding: 3px 9px; border-radius: 999px; background: hsl(var(--surface-raised));
  }
  .count b { color: hsl(var(--accent)); font-weight: 600; }
  kbd {
    font: inherit; font-size: 11px; color: hsl(var(--text-muted));
    border: 1px solid hsl(var(--border)); border-radius: 4px;
    padding: 1px 5px; background: hsl(var(--surface));
  }

  /* ---- filter chips ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; align-items: center; min-height: 20px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; line-height: 1;
    padding: 6px 7px 6px 10px; border-radius: 999px;
    background: hsl(var(--surface-raised));
    border: 1px solid hsl(var(--border));
    color: hsl(var(--text));
    animation: chipIn .22s ease;
  }
  @keyframes chipIn { from { opacity: 0; transform: translateY(-3px) scale(.96); } }
  .chip .k { color: hsl(var(--text-muted)); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip button {
    all: unset; cursor: pointer; display: grid; place-items: center;
    width: 16px; height: 16px; border-radius: 50%; color: hsl(var(--text-muted));
  }
  .chip button:hover { background: hsl(var(--surface)); color: hsl(var(--text)); }
  .chips .clear {
    font-size: 11.5px; color: hsl(var(--text-muted)); cursor: pointer;
    margin-left: 2px; padding: 5px 8px; border-radius: 999px;
  }
  .chips .clear:hover { color: hsl(var(--text)); background: hsl(var(--surface-raised)); }
  .chips .hint { margin-left: auto; font-size: 11.5px; color: hsl(var(--text-muted)); display: flex; gap: 6px; align-items: center; }

  /* ---- gallery ---- */
  .scroll { flex: 1; overflow-y: auto; padding: 4px 28px 60px; }
  .gallery { max-width: 1120px; margin: 0 auto; }

  .bucket { display: flex; gap: 20px; margin-top: 10px; overflow: hidden; transition: opacity .3s ease; }
  .bucket.bucket-hidden { display: none; }
  .rail {
    flex: none; width: 92px; padding-top: 18px; text-align: right;
    position: sticky; top: 92px; align-self: flex-start;
  }
  .rail .label { font-size: 12px; color: hsl(var(--text-muted)); font-weight: 500; }
  .rail .n { font-size: 10.5px; color: hsl(var(--text-muted) / 0.65); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .grid {
    flex: 1; display: grid; gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
    border-top: 1px solid hsl(var(--border) / 0.5);
    padding-top: 10px; margin-bottom: 8px;
  }

  /* ---- flask card ---- */
  .card {
    display: flex; flex-direction: column; text-align: left;
    padding: 12px 12px 13px; border-radius: var(--radius);
    background: none; border: 1px solid transparent; cursor: pointer;
    transition: opacity .26s ease, transform .26s ease, filter .26s ease,
                background-color .15s ease, box-shadow .4s ease;
  }
  .card:hover { background: hsl(var(--surface-raised)); }
  .card .flaskbox { height: 72px; display: grid; place-items: center; }
  .card .flaskbox svg { filter: drop-shadow(0 4px 10px hsl(var(--surface) / 0.6)); }
  .card .titlerow { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; }
  .card .dots { display: flex; margin-top: 5px; flex: none; }
  .card .dots span { width: 6px; height: 6px; border-radius: 50%; margin-right: -2px; }
  .card .title { font-size: 13.5px; font-weight: 500; color: hsl(var(--text)); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .reason {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 7px;
    font-size: 10px; letter-spacing: .03em; text-transform: uppercase;
    color: hsl(var(--accent)); opacity: .9;
  }
  .card .reason svg { opacity: .8; }
  .card .snippet { font-size: 12px; line-height: 1.4; color: hsl(var(--text-muted)); margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .snippet.context { -webkit-line-clamp: 2; color: hsl(var(--text) / 0.78); }
  .card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 9px; font-size: 10.5px; color: hsl(var(--text-muted)); }
  .card .tag {
    padding: 1px 7px; border-radius: 999px; background: hsl(var(--surface-raised));
    color: hsl(var(--text-muted)); cursor: pointer; transition: background-color .15s, color .15s, box-shadow .2s;
  }
  .card:hover .tag { background: hsl(var(--surface)); }
  .card .tag:hover { color: hsl(var(--text)); }
  .card .tag.hit {
    background: hsl(var(--accent) / 0.18); color: hsl(var(--accent));
    box-shadow: inset 0 0 0 1px hsl(var(--accent) / 0.3);
  }
  .card .time { margin-left: auto; color: hsl(var(--text-muted) / 0.8); }

  mark {
    background: hsl(var(--accent) / 0.26); color: hsl(var(--text));
    border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px hsl(var(--accent) / 0.12);
  }

  /* match / leave animation states */
  .card.leaving { opacity: 0; transform: scale(.9); filter: blur(4px); pointer-events: none; }
  .card.gone { display: none; }
  .card.match-pop { animation: pop .5s ease; }
  @keyframes pop {
    0% { box-shadow: 0 0 0 0 hsl(var(--accent-glow) / 0); }
    35% { box-shadow: 0 0 22px 2px hsl(var(--accent-glow) / 0.22); transform: scale(1.015); }
    100% { box-shadow: 0 0 0 0 hsl(var(--accent-glow) / 0); transform: scale(1); }
  }

  .empty {
    display: none; text-align: center; color: hsl(var(--text-muted));
    padding: 70px 0 40px; font-size: 14px;
  }
  .empty.show { display: block; }
  .empty .big { font-size: 15px; color: hsl(var(--text)); margin-bottom: 4px; }

  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 10px; border: 3px solid hsl(var(--surface)); }
</style>

<div class="mist"><span class="m1"></span><span class="m2"></span><span class="m3"></span></div>

<div class="app">
  <div class="top">
    <div class="bar-wrap">
      <div class="bar">
        <svg class="lens" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input id="q" type="text" placeholder="Summon a memory — title, tag, or anything you wrote…" autocomplete="off" spellcheck="false" />
        <span class="count" id="count"><b>18</b> / 18</span>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="scroll">
    <div class="gallery" id="gallery"></div>
    <div class="empty" id="empty">
      <div class="big">No flask holds that yet.</div>

</div>

<script>
// ---------- category palette ----------
const CAT = {
  orange: { v: '24 85% 68%',  name: 'Notes & Lessons' },
  gray:   { v: '220 10% 72%', name: 'In my mind' },
  green:  { v: '145 50% 62%', name: 'Execution' },
  blue:   { v: '210 80% 70%', name: 'Ideas' },
  purple: { v: '265 60% 74%', name: 'Dreams' },
  pink:   { v: '330 70% 74%', name: 'People' },
};

// ---------- flask SVG (vial with liquid fill + glow + meniscus + cork) ----------
const SHAPES = {
  'vial':         { d:'M8 3 L8 23.5 C8 27 9.5 28 12 28 C14.5 28 16 27 16 23.5 L16 3 Z', mL:8, mR:16, rx:3.8, floor:25.5, brim:5 },
  'erlenmeyer':   { d:'M9.5 3 L9.5 10 L4 25 C3.6 26.2 4.2 27 5.4 27 L18.6 27 C19.8 27 20.4 26.2 20 25 L14.5 10 L14.5 3 Z', mL:9.5, mR:14.5, rx:4.2, floor:25, brim:7 },
  'round-bottom': { d:'M10 3 C10 10 10 11 8.5 12.5 C4.5 16 3 20 5 24 C7 27.5 9.5 28 12 28 C14.5 28 17 27.5 19 24 C21 20 19.5 16 15.5 12.5 C14 11 14 10 14 3 Z', mL:10, mR:14, rx:6, floor:25, brim:9 },
  'teardrop':     { d:'M12 3 C12 3 6.5 11 5.5 16 C4.5 21.5 8 27 12 27 C16 27 19.5 21.5 18.5 16 C17.5 11 12 3 12 3 Z', mL:11, mR:13, rx:6, floor:24.5, brim:11 },
  'potion-bottle':{ d:'M9.5 3 L9.5 7 C9.5 9 5 9.5 5 13 L5 25 C5 27 6 27.5 7.5 27.5 L16.5 27.5 C18 27.5 19 27 19 25 L19 13 C19 9.5 14.5 9 14.5 7 L14.5 3 Z', mL:9.5, mR:14.5, rx:6.6, floor:25, brim:9 },
  'beaker':       { d:'M5 7 L19 7 L19 25 C19 27 18 27.5 16 27.5 L8 27.5 C6 27.5 5 27 5 25 Z', mL:5, mR:19, rx:7, floor:25.5, brim:8, noCork:true, lip:'M5 7 q-1.6 0.2 -2 2' },
};
let uid = 0;
function flask(shape, catV, fill, size) {
  const s = SHAPES[shape]; const id = 'f' + (uid++);
  const C = a => `hsl(${catV} / ${a})`;
  const level = s.floor + (s.brim - s.floor) * fill;
  const rx = s.rx * (0.5 + 0.5 * fill);
  const h = size * 30 / 24;
  const cork = s.noCork ? '' :
    `<rect x="${s.mL-0.5}" y="1" width="${s.mR-s.mL+1}" height="5" rx="2" fill="currentColor" fill-opacity="0.45" stroke="currentColor" stroke-opacity="0.3"/>
     <rect x="${s.mL-0.5}" y="2.5" width="${s.mR-s.mL+1}" height="1.1" fill="#fff" fill-opacity="0.16"/>`;
  const lip = s.lip ? `<path d="${s.lip}" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.25" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : '';
  return `<svg width="${size}" height="${h}" viewBox="0 0 24 30" fill="none" style="color:hsl(${catV})">
    <defs>
      <clipPath id="c${id}"><path d="${s.d}"/></clipPath>
      <linearGradient id="l${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${C(0.5)}"/><stop offset="1" stop-color="${C(0.78)}"/>
      </linearGradient>
      <radialGradient id="g${id}" cx="50%" cy="66%" r="60%">
        <stop offset="0" stop-color="${C(0.42)}"/><stop offset="1" stop-color="${C(0)}"/>
      </radialGradient>
    </defs>
    <ellipse cx="12" cy="20" rx="11" ry="12" fill="url(#g${id})"/>
    <path d="${s.d}" fill="currentColor" fill-opacity="0.05"/>
    <path d="${s.d}" fill="${C(0.12)}"/>
    <g clip-path="url(#c${id})">
      <rect x="0" y="${level}" width="24" height="30" fill="url(#l${id})"/>
      <ellipse cx="12" cy="${level}" rx="${rx}" ry="1.7" fill="${C(0.85)}"/>
      <ellipse cx="12" cy="${level-0.4}" rx="${rx*0.7}" ry="0.6" fill="#fff" opacity="0.4"/>
    </g>
    <path d="${s.d}" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.25" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${lip}
    <ellipse cx="9" cy="14" rx="1.1" ry="2.4" fill="#fff" opacity="0.45" transform="rotate(-18 9 14)"/>
    ${cork}
  </svg>`;
}

// ---------- mock notes (newest first, grouped by bucket) ----------
const notes = [
  // Today
  { b:'Today', cat:'gray', shape:'vial', fill:.6, time:'8:12', title:'Morning pages: the fog lifts after writing',
    tags:['reflection','focus','morning'],
    body:'Three pages before coffee and the anxious fog finally lifts. Writing by hand slows my thinking enough to actually hear it. Focus comes easier once the noise is on paper.' },
  { b:'Today', cat:'green', shape:'erlenmeyer', fill:.82, time:'9:40', title:'Ship the search bar today',
    tags:['focus','execution','search'],
    body:'Decided to cut scope hard: one summon bar, live filtering, the timeline stays. Everything else waits. Shipping beats polishing.' },
  { b:'Today', cat:'pink', shape:'teardrop', fill:.3, time:'11:05', title:'Call mum back',
    tags:['people','family'],
    body:'She left two voicemails. Remember to ask about the garden and dad’s appointment on Thursday.' },

  // Yesterday
  { b:'Yesterday', cat:'gray', shape:'round-bottom', fill:.7, time:'7:30', title:'Why I keep avoiding deep work',
    tags:['focus','reflection','work'],
    body:'Noticed I reach for email the moment a task gets hard. The avoidance is fear dressed as busyness. Protect two hours of focus before noon.' },
  { b:'Yesterday', cat:'blue', shape:'potion-bottle', fill:.5, time:'14:20', title:'Idea: flasks could breathe when idle',
    tags:['ideas','design'],
    body:'A slow liquid sway on the home gallery when nothing is selected — alive but calm. Only on desktop, never on battery.' },
  { b:'Yesterday', cat:'green', shape:'beaker', fill:.6, time:'19:00', title:'Gym: deadlift form finally clicked',
    tags:['health','execution'],
    body:'Bracing before the pull, not during. Three clean sets at 100kg. Sleep was good so energy held through the session.' },

  // Last week
  { b:'Last week', cat:'purple', shape:'teardrop', fill:.4, time:'Sep 30', title:'A dream about the old house',
    tags:['dreams','reflection'],
    body:'Walking through the Brno flat, every room larger than it was. Woke up missing a version of myself I can’t quite name.' },
  { b:'Last week', cat:'orange', shape:'vial', fill:.7, time:'Sep 29', title:'Lesson: slow is smooth, smooth is fast',
    tags:['lessons','focus','work'],
    body:'Rushed the release and spent two days on a bug that patience would have caught. Focus on the step in front of you.' },
  { b:'Last week', cat:'green', shape:'erlenmeyer', fill:.5, time:'Sep 28', title:'Plan the Q4 reading list',
    tags:['execution','books'],
    body:'Fewer books, finished properly. Deep Work again, plus something on attention and something pure fiction for sleep.' },
  { b:'Last week', cat:'pink', shape:'round-bottom', fill:.6, time:'Sep 27', title:'People who energize me',
    tags:['people','reflection'],
    body:'A short list. Protect time with them, cut the ones who drain. Energy is the real budget, not hours.' },

  // Last month
  { b:'Last month', cat:'orange', shape:'vial', fill:.5, time:'Sep 18', title:'The attention economy ate my evenings',
    tags:['focus','lessons'],
    body:'Four hours gone to feeds with nothing to show. Delete the apps from the phone, keep them on desktop only where friction is higher.' },
  { b:'Last month', cat:'blue', shape:'potion-bottle', fill:.72, time:'Sep 15', title:'Rough idea for an AI journaling coach',
    tags:['ideas','execution'],
    body:'It reads the week and tells me what matters for my goals — not a chatbot, a mirror. Local, private, never nagging.' },
  { b:'Last month', cat:'green', shape:'beaker', fill:.6, time:'Sep 12', title:'Sleep experiment: no screens after ten',
    tags:['health','sleep','execution'],
    body:'One week. Fell asleep faster, woke clearer. The hardest part was the first twenty restless minutes in the dark.' },
  { b:'Last month', cat:'orange', shape:'vial', fill:.82, time:'Sep 9', title:'Notes from the Steve Jobs biography',
    tags:['lessons','focus','books'],
    body:'Say no to a thousand things. Focus is deciding what not to do. Craft is caring about the parts no one will ever see.' },

  // September
  { b:'September', cat:'purple', shape:'teardrop', fill:.4, time:'Sep 3', title:'Dream: flying over a silver sea',
    tags:['dreams'],
    body:'Low over the water at dusk, completely calm. The kind of dream I want to remember on the hard mornings.' },
  { b:'September', cat:'green', shape:'erlenmeyer', fill:.6, time:'Sep 1', title:'First week at the new role',
    tags:['work','execution','people'],
    body:'More trust than I expected and less structure. Make a plan nobody asked for. Energy high but sleep slipped.' },
  { b:'September', cat:'pink', shape:'round-bottom', fill:.5, time:'Sep 1', title:'Grandmother’s recipe, written down at last',
    tags:['people','family'],
    body:'Sat with mum and finally wrote the dumpling recipe before it’s lost. A small act, oddly moving.' },

  // August
  { b:'August', cat:'gray', shape:'vial', fill:.7, time:'Aug 24', title:'What I want this year to be about',
    tags:['reflection','focus'],
    body:'Less input, more making. Deep focus over shallow reach. Fewer, better friendships. Sleep like it matters, because it does.' },
];
const BUCKETS = ['Today','Yesterday','Last week','Last month','September','August'];

// ---------- filter chips (seeded: a tag + a date) ----------
const DATE_RANGES = {
  last30: { label: 'Last 30 days', buckets: ['Today','Yesterday','Last week','Last month'] },
};
let chips = [
  { type:'tag',  value:'focus',  label:'focus' },
  { type:'date', value:'last30', label:'Last 30 days' },
];

// ---------- build gallery DOM once ----------
const gallery = document.getElementById('gallery');
const cardEls = []; // { el, note, refs }
notes.forEach((n, i) => { n._i = i; });

BUCKETS.forEach(bk => {
  const inBucket = notes.filter(n => n.b === bk);
  if (!inBucket.length) return;
  const bucket = document.createElement('div');
  bucket.className = 'bucket';
  bucket.dataset.bucket = bk;

  const rail = document.createElement('div');
  rail.className = 'rail';
  rail.innerHTML = `<div class="label">${bk}</div><div class="n" data-n></div>`;

  const grid = document.createElement('div');
  grid.className = 'grid';

  inBucket.forEach(n => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="flaskbox">${flask(n.shape, CAT[n.cat].v, n.fill, 56)}</div>
      <div class="titlerow">
        <div class="dots"><span style="background:hsl(${CAT[n.cat].v})"></span></div>
        <div class="title"></div>
      </div>
      <div class="reason" hidden></div>
      <div class="snippet"></div>
      <div class="meta"></div>`;
    el.title = CAT[n.cat].name;
    grid.appendChild(el);
    cardEls.push({ el, note: n,
      title: el.querySelector('.title'),
      reason: el.querySelector('.reason'),
      snippet: el.querySelector('.snippet'),
      meta: el.querySelector('.meta'),
      dot: el.querySelector('.dots span'),
    });
  });

  bucket.appendChild(rail);
  bucket.appendChild(grid);
  gallery.appendChild(bucket);
});

// ---------- helpers ----------
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function highlight(text, needle) {
  if (!needle) return esc(text);
  const lc = text.toLowerCase(), n = needle.toLowerCase();
  let out = '', i = 0, idx;
  while ((idx = lc.indexOf(n, i)) !== -1) {
    out += esc(text.slice(i, idx)) + '<mark>' + esc(text.slice(idx, idx + n.length)) + '</mark>';
    i = idx + n.length;
  }
  return out + esc(text.slice(i));
}
function contextSnippet(body, needle) {
  const lc = body.toLowerCase(), idx = lc.indexOf(needle.toLowerCase());
  let start = Math.max(0, idx - 30), end = Math.min(body.length, idx + needle.length + 46);
  let frag = body.slice(start, end);
  if (start > 0) frag = '…' + frag.replace(/^\S*\s/, '');
  if (end < body.length) frag = frag.replace(/\s\S*$/, '') + '…';
  return highlight(frag, needle);
}
const RICON = {
  title: '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>',
  tag:   '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.5 13 3.5a2 2 0 0 0-1.4-.6H5a2 2 0 0 0-2 2v6.6a2 2 0 0 0 .6 1.4l7 7a2 2 0 0 0 2.8 0l6.6-6.6a2 2 0 0 0 0-2.8Z"/><circle cx="8" cy="8" r="1.3"/></svg>',
  body:  '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 4h9l5 5v11H6zM14 4v6h6"/></svg>',
};

// ---------- render chips ----------
const chipsEl = document.getElementById('chips');
function renderChips() {
  chipsEl.innerHTML = '';
  chips.forEach((c, i) => {
    const el = document.createElement('span');
    el.className = 'chip';
    if (c.type === 'tag') el.innerHTML = `<span class="k">tag</span> ${esc(c.label)}`;
    else el.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="hsl(var(--text-muted))" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg> ${esc(c.label)}`;
    const x = document.createElement('button');
    x.setAttribute('aria-label', 'Remove filter');
    x.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>';
    x.onclick = () => { chips.splice(i, 1); renderChips(); apply(true); };
    el.appendChild(x);
    chipsEl.appendChild(el);
  });
  if (chips.length) {
    const clr = document.createElement('span');
    clr.className = 'clear'; clr.textContent = 'Clear all';
    clr.onclick = () => { chips = []; renderChips(); apply(true); };
    chipsEl.appendChild(clr);
  }
  const hint = document.createElement('span');
  hint.className = 'hint';
  hint.innerHTML = `<kbd>/</kbd> to summon &nbsp; <kbd>esc</kbd> to clear`;
  chipsEl.appendChild(hint);
}

// ---------- the filter ----------
const input = document.getElementById('q');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');

function passesChips(n) {
  const tagChips = chips.filter(c => c.type === 'tag');
  const dateChips = chips.filter(c => c.type === 'date');
  for (const c of tagChips) if (!n.tags.includes(c.value)) return false;
  for (const c of dateChips) if (!DATE_RANGES[c.value].buckets.includes(n.b)) return false;
  return true;
}

function apply(pop) {
  const q = input.value.trim();
  const lc = q.toLowerCase();
  let visible = 0;
  const perBucket = {};

  cardEls.forEach(c => {
    const n = c.note;
    const chipOk = passesChips(n);
    let textOk = true, titleHit = false, tagHit = false, bodyHit = false;
    if (lc) {
      titleHit = n.title.toLowerCase().includes(lc);
      tagHit = n.tags.some(t => t.toLowerCase().includes(lc));
      bodyHit = n.body.toLowerCase().includes(lc);
      textOk = titleHit || tagHit || bodyHit;
    }
    const show = chipOk && textOk;

    // --- update card contents for the match reason ---
    c.title.innerHTML = highlight(n.title, lc);

    // reason label (strongest reason, in priority: title > tag > body)
    if (lc && show) {
      let r = '';
      if (titleHit) r = RICON.title + ' in title';
      else if (tagHit) r = RICON.tag + ' in tag';
      else if (bodyHit) r = RICON.body + ' in note';
      c.reason.innerHTML = r; c.reason.hidden = false;
    } else {
      c.reason.hidden = true;
    }

    // snippet: a body-hit reveals a context line w/ highlight; otherwise the normal excerpt
    if (lc && bodyHit && !titleHit) {
      c.snippet.className = 'snippet context';
      c.snippet.innerHTML = contextSnippet(n.body, q);
    } else {
      c.snippet.className = 'snippet';
      c.snippet.textContent = n.body;
    }

    // tags + time, highlighting a tag that matches
    c.meta.innerHTML = '';
    n.tags.slice(0, 3).forEach(t => {
      const tg = document.createElement('span');
      tg.className = 'tag' + (lc && t.toLowerCase().includes(lc) ? ' hit' : '');
      tg.textContent = t;
      tg.onclick = (e) => { e.stopPropagation(); addTagChip(t); };
      c.meta.appendChild(tg);
    });
    const tm = document.createElement('span');
    tm.className = 'time'; tm.textContent = n.time;
    c.meta.appendChild(tm);

    // --- visibility transition ---
    const wasGone = c.el.classList.contains('gone') || c.el.classList.contains('leaving');
    if (show) {
      visible++;
      perBucket[n.b] = (perBucket[n.b] || 0) + 1;
      if (wasGone) {
        c.el.classList.remove('gone', 'leaving');
        if (pop !== false) { c.el.classList.remove('match-pop'); void c.el.offsetWidth; c.el.classList.add('match-pop'); }
      }
    } else {
      if (!c.el.classList.contains('gone')) {
        c.el.classList.add('leaving');
        clearTimeout(c._t);
        c._t = setTimeout(() => { if (c.el.classList.contains('leaving')) c.el.classList.add('gone'); }, 260);
      }
    }
  });

  // buckets: hide empty ones, update rail counts
  document.querySelectorAll('.bucket').forEach(b => {
    const n = perBucket[b.dataset.bucket] || 0;
    b.classList.toggle('bucket-hidden', n === 0);
    b.querySelector('[data-n]').textContent = n ? (n === 1 ? '1 flask' : n + ' flasks') : '';
  });

  countEl.innerHTML = `<b>${visible}</b> / ${notes.length}`;
  emptyEl.classList.toggle('show', visible === 0);
}

function addTagChip(tag) {
  if (chips.some(c => c.type === 'tag' && c.value === tag)) return;
  chips.push({ type:'tag', value:tag, label:tag });
  renderChips(); apply(true);
}

// ---------- events ----------
let raf;
input.addEventListener('input', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => apply(true)); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  else if (e.key === 'Escape') {
    input.value = ''; chips = []; renderChips(); apply(false); input.blur();
  }
});

renderChips();
apply(false);
</script>
