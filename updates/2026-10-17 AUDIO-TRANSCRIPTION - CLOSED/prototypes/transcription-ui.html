<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pensieve · Transcription queue</title>
  <style>
/* _kit.css inlined so this file works standalone over file:// */
/* ============================================================================
   _kit.css — Pensieve AUDIO design system (shared prototype stylesheet).
   ----------------------------------------------------------------------------
   THE single source of visual truth for every audio prototype. Each .html links
   this file and the per-surface agents BUILD ON these classes — they never grow
   a second radius, shadow, accent hue, or bar height. Mirrors the real app's
   src/styles/tokens.css (light :root + dark override) and the design.md rules:
     · ONE accent (the magical blue). State colours exist, never as decoration.
     · Shadows/gradients are reserved for the magical language (accent halo, the
       Basin depth) — never a drop-shadow to "lift" flat UI.
     · Fixed type scale (11/12/14/16/18), mono for time/timecode.
     · Fixed radius scale (base 6 → 4/6/10/14/20/full) + 4px spacing grid.
   Colour format: `H S% L%`, consumed as `hsl(var(--token) / <alpha>)`.
   ========================================================================= */

/* ── Tokens — light (mirror of tokens.css :root) ─────────────────────────── */
:root {
  color-scheme: light;
  --surface: 210 30% 99%;
  --surface-sunken: 214 20% 96%;
  --surface-raised: 214 16% 94%;
  --text: 218 16% 19%;
  --text-muted: 218 9% 45%;
  --border: 214 15% 90%;
  --accent: 216 83% 49%;
  --accent-glow: 216 90% 60%;
  --success: 150 30% 40%;
  --warn: 32 80% 45%;
  --danger: 0 72% 58%;
  --gold: 43 92% 55%;

  --font-sans: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", system-ui, "Inter", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --radius: 6px;
  --font-scale: 1;

  /* ── Audio-system constants (derive, don't re-type magic numbers) ──────── */
  --audio-bar-h: 56px;          /* inline player bar height (14 * 4px grid) */
  --audio-bar-h-compact: 44px;  /* dense contexts: gallery tile / search hit */
  --audio-play-size: 36px;      /* primary play/pause control diameter */
  --audio-play-size-sm: 28px;   /* compact play control */
  --audio-icon-btn: 28px;       /* ⋯ and transcript icon-button hit box */
  --wave-bar-w: 2px;            /* waveform bar width */
  --wave-bar-gap: 1px;          /* gap between bars (→ 3px pitch) */
  --wave-min: 0.12;             /* floor so a silent bar still reads as a tick */

  /* Motion — all subtle, calm. */
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --dur-fast: 120ms;
  --dur: 180ms;
  --dur-slow: 320ms;
}

/* ── Tokens — dark. Supports BOTH conventions: the prototype toggle writes
   :root[data-theme="dark"]; the real app uses .dark. Keep them identical. ── */
:root[data-theme="dark"],
.dark {
  color-scheme: dark;
  --surface: 222 24% 11%;
  --surface-sunken: 222 22% 13%;
  --surface-raised: 222 18% 17%;
  --text: 216 18% 84%;
  --text-muted: 218 12% 60%;
  --border: 222 16% 21%;
  --accent: 215 85% 74%;
  --accent-glow: 218 100% 72%;
  --success: 150 28% 55%;
  --warn: 36 85% 58%;
  --danger: 0 68% 65%;
  --gold: 43 92% 55%;
}

/* ── Base reset + Pensieve typography ────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 16px;                 /* body */
  line-height: 1.5;
  color: hsl(var(--text));
  background: hsl(var(--surface));
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; color: inherit; }
:where(button, [role="button"], [tabindex]):focus-visible {
  outline: 2px solid hsl(var(--accent));
  outline-offset: 2px;
  border-radius: var(--radius);
}

/* Type-scale helpers (use these, never arbitrary px). */
.t-micro  { font-size: 11px; }         /* labels / chips / dates / counts */
.t-meta   { font-size: 12px; }         /* meta */
.t-ctl    { font-size: 14px; }         /* secondary / controls */
.t-body   { font-size: 16px; }         /* body */
.t-mono   { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ════════════════════════════════════════════════════════════════════════
   AUDIO BAR — the core element. A calm horizontal pill:
   [ play ] [ waveform + progress ] [ time ] [ transcript ] [ ⋯ ]
   Lives inline in a note AND inside a gallery; same family everywhere.
   ════════════════════════════════════════════════════════════════════════ */
.audio-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: var(--audio-bar-h);
  padding: 8px 12px;
  background: hsl(var(--surface-sunken));
  border: 1px solid hsl(var(--border));
  border-radius: 10px;                 /* rounded-lg */
  color: hsl(var(--text));
  /* NO drop-shadow — the resting bar is flat. Depth is earned only by the
     playing-state accent halo below. */
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.audio-bar.is-compact {
  min-height: var(--audio-bar-h-compact);
  gap: 8px;
  padding: 6px 10px;
}
/* Playing: the one permitted magical lift — a faint accent halo, not a shadow. */
.audio-bar.is-playing {
  border-color: hsl(var(--accent) / 0.45);
  box-shadow: 0 0 0 1px hsl(var(--accent) / 0.12), 0 0 24px -6px hsl(var(--accent-glow) / 0.35);
}
.audio-bar.is-broken {
  border-color: hsl(var(--danger) / 0.45);
  background: hsl(var(--danger) / 0.05);
}

/* ── Play / pause control — the single accent-FILLED element on the bar ──── */
.audio-play {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: var(--audio-play-size);
  height: var(--audio-play-size);
  border: none;
  border-radius: var(--radius);        /* a soft square, not a hard circle — Pensieve, not Spotify */
  background: hsl(var(--accent));
  color: hsl(var(--surface));           /* glyph reads on the accent fill in both themes */
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
}
.audio-play:hover { background: hsl(var(--accent-glow)); }
.audio-play:active { transform: scale(0.94); }
.is-playing .audio-play { box-shadow: 0 0 20px -4px hsl(var(--accent-glow) / 0.6); }
.audio-play.is-sm { width: var(--audio-play-size-sm); height: var(--audio-play-size-sm); border-radius: calc(var(--radius) - 2px); }
.audio-play svg { width: 55%; height: 55%; display: block; }
.audio-play.is-loading { pointer-events: none; }
.audio-play.is-loading svg { animation: audio-spin 900ms linear infinite; opacity: 0.8; }
@keyframes audio-spin { to { transform: rotate(360deg); } }

/* ── Waveform — the amplitude visualization + scrub surface ──────────────── */
.audio-wave {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  height: 32px;
  cursor: pointer;
  touch-action: none;                   /* we own the drag */
}
.audio-bar.is-compact .audio-wave { height: 24px; }
.audio-wave canvas { display: block; width: 100%; height: 100%; }
/* Hover scrubline — a thin accent tick that follows the cursor (affordance). */
.audio-wave .audio-scrubline {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: hsl(var(--accent) / 0.55);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease);
}
.audio-wave:hover .audio-scrubline { opacity: 1; }
/* Hover time bubble above the scrubline. */
.audio-wave .audio-scrubtime {
  position: absolute;
  bottom: calc(100% + 4px);
  transform: translateX(-50%);
  padding: 1px 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: hsl(var(--text));
  background: hsl(var(--surface-raised));
  border: 1px solid hsl(var(--border));
  border-radius: calc(var(--radius) - 2px);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease);
}
.audio-wave:hover .audio-scrubtime { opacity: 1; }
.audio-wave.is-scrubbing { cursor: grabbing; }
.audio-wave.is-scrubbing .audio-scrubline,
.audio-wave.is-scrubbing .audio-scrubtime { opacity: 1; }

/* ── Time readout — mono, tabular. "current / total" or just current. ───── */
.audio-time {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: hsl(var(--text-muted));
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.audio-time .cur { color: hsl(var(--text)); }
.audio-time .sep { opacity: 0.5; margin: 0 1px; }

/* ── Icon buttons (transcript + ⋯) — ghost by default ────────────────────── */
.audio-iconbtn {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: var(--audio-icon-btn);
  height: var(--audio-icon-btn);
  padding: 0;
  border: none;
  background: transparent;
  color: hsl(var(--text-muted));
  border-radius: var(--radius);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.audio-iconbtn:hover { background: hsl(var(--accent) / 0.12); color: hsl(var(--text)); }
.audio-iconbtn svg { width: 17px; height: 17px; display: block; }
.audio-iconbtn[aria-expanded="true"] { background: hsl(var(--accent) / 0.12); color: hsl(var(--text)); }

/* Transcript icon — its state is the signal, never a second colour:
     present    → accent-tinted, "open transcript"
     absent     → faint ghost (lives in the ⋯ menu as "Create transcript")
     transcribing → muted + a quiet looping pulse, NEVER a blocking spinner */
.audio-transcript.is-present { color: hsl(var(--accent)); }
.audio-transcript.is-present:hover { background: hsl(var(--accent) / 0.14); color: hsl(var(--accent)); }
.audio-transcript.is-absent { color: hsl(var(--text-muted) / 0.55); }
.audio-transcript.is-transcribing { color: hsl(var(--text-muted)); cursor: default; }
.audio-transcript.is-transcribing svg { animation: audio-pulse 1.6s var(--ease) infinite; }
@keyframes audio-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

/* Quiet non-blocking status line (e.g. "Transcribing… 40%") shown under/beside
   the bar — reserved, calm, never a modal. */
.audio-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: hsl(var(--text-muted));
  font-variant-numeric: tabular-nums;
}
.audio-status .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: hsl(var(--accent));
  animation: audio-pulse 1.6s var(--ease) infinite;
}
.audio-status.is-saving .dot { background: hsl(var(--gold)); }

/* Broken-state inline notice — ONE row at the standard bar height, never taller.
   The filename truncates with an ellipsis; Locate… stays compact inline. */
.audio-broken {
  display: flex; align-items: center; gap: 8px;
  flex: 1 1 auto; min-width: 0;
  flex-wrap: nowrap;            /* never wrap onto a second row */
  overflow: hidden;
  color: hsl(var(--text-muted));
  font-size: 12px;
}
.audio-broken > svg { flex: 0 0 auto; width: 16px; height: 16px; }  /* MUST size it: engine glyphs have no intrinsic w/h → default 300×150 balloons the bar + hides Locate */
/* The message span is the shrinkable one: it truncates with an ellipsis. */
.audio-broken-text {
  min-width: 0;                 /* allow the flex item to shrink below content */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.audio-broken .name { font-family: var(--font-mono); font-size: 11px; color: hsl(var(--text)); }
.audio-broken-locate {
  margin-left: auto;
  flex: 0 0 auto;               /* stays compact, never shrinks or wraps */
  white-space: nowrap;
  padding: 3px 9px;
  border: 1px solid hsl(var(--border));
  background: hsl(var(--surface));
  color: hsl(var(--text));
  border-radius: calc(var(--radius) - 2px);
  font-size: 12px; cursor: pointer;
}
.audio-broken-locate:hover { border-color: hsl(var(--accent) / 0.5); }

/* ── ⋯ menu (Download recording / Create transcript / …) ─────────────────── */
.audio-menu-backdrop { position: fixed; inset: 0; z-index: 19; }
.audio-menu {
  position: absolute;
  z-index: 20;
  min-width: 12rem;
  display: flex; flex-direction: column;
  padding: 4px;
  background: hsl(var(--surface-raised));
  border: 1px solid hsl(var(--border));
  border-radius: var(--radius);
  box-shadow: 0 10px 30px -10px hsl(0 0% 0% / 0.35);  /* menu depth — the sanctioned use */
  line-height: 1.2;
}
.audio-menu button {
  display: flex; align-items: center; gap: 9px;
  text-align: left;
  padding: 7px 10px;
  border: none; background: transparent; color: hsl(var(--text));
  border-radius: calc(var(--radius) - 2px);
  font-size: 14px; cursor: pointer;
}
.audio-menu button:hover { background: hsl(var(--accent) / 0.12); }
.audio-menu button svg { width: 15px; height: 15px; color: hsl(var(--text-muted)); flex: 0 0 auto; }
.audio-menu button:hover svg { color: hsl(var(--text)); }
.audio-menu button[disabled] { opacity: 0.45; pointer-events: none; }
.audio-menu-sep { height: 1px; margin: 4px 2px; background: hsl(var(--border)); }

/* ════════════════════════════════════════════════════════════════════════
   TRANSCRIPT reading experience — a docked player on top, text below, with
   word-by-word highlight + click-to-seek. Used standalone (phone/overlay) and
   as the RIGHT pane of the desktop split view.
   ════════════════════════════════════════════════════════════════════════ */
.transcript {
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  background: hsl(var(--surface));
}
/* Docked player — sticky to the top of the transcript column (Spotify-like). */
.transcript-dock {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 12px 16px;
  background: hsl(var(--surface) / 0.9);
  backdrop-filter: saturate(1.1) blur(8px);
  border-bottom: 1px solid hsl(var(--border));
}
.transcript-dock .audio-bar { background: transparent; border: none; padding: 0; min-height: auto; }
.transcript-dock-meta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px;
  font-size: 11px; color: hsl(var(--text-muted));
}
.transcript-dock-meta .chip {
  padding: 1px 7px;
  border: 1px solid hsl(var(--border));
  border-radius: 999px;
  background: hsl(var(--surface-raised));
}

/* Scrollable transcript body. */
.transcript-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 16px 40vh;              /* trailing room so the last line can center */
  scroll-behavior: smooth;
}

/* A speaker turn — grouped by segment speaker. Diarization is shown WITHOUT a
   second accent hue: label + a left rail keyed to the speaker by alpha/weight,
   and alternating turns get a faint sunken wash. */
.turn { display: grid; grid-template-columns: 7rem 1fr; gap: 12px; padding: 8px 4px; border-radius: var(--radius); }
.turn + .turn { margin-top: 2px; }
.turn.is-active { background: hsl(var(--accent) / 0.05); }
.turn-gutter { text-align: right; padding-top: 2px; user-select: none; }
.turn-speaker {
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  color: hsl(var(--text-muted));
}
.turn.spk-0 .turn-speaker { color: hsl(var(--text)); }          /* two speakers told apart by */
.turn.spk-1 .turn-speaker { color: hsl(var(--text-muted)); }    /* weight/tone, not a 2nd hue */
.turn-time { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: 11px; color: hsl(var(--text-muted) / 0.8); }
.turn-text { font-size: 16px; line-height: 1.6; color: hsl(var(--text)); }
.turn.spk-1 .turn-text { color: hsl(var(--text) / 0.92); }

/* A clickable word. Resting = plain text; hover shows it's seekable. */
.word { border-radius: 3px; padding: 0 0.5px; cursor: pointer; transition: background var(--dur-fast) linear, color var(--dur-fast) linear; }
.word:hover { background: hsl(var(--accent) / 0.12); }
/* Already spoken (read) — subtly dimmed so the eye finds "where we are". */
.word.is-read { color: hsl(var(--text-muted)); }
/* The word being spoken right now — the single live accent highlight. */
.word.is-active { background: hsl(var(--accent) / 0.22); color: hsl(var(--text)); box-shadow: 0 0 0 1px hsl(var(--accent) / 0.25); }
:root[data-theme="dark"] .word.is-active,
.dark .word.is-active { background: hsl(var(--accent) / 0.28); color: hsl(var(--surface)); box-shadow: none; }

/* ════════════════════════════════════════════════════════════════════════
   SPLIT VIEW — desktop: editor (left) | transcript (right), draggable divider.
   ════════════════════════════════════════════════════════════════════════ */
.split {
  display: grid;
  grid-template-columns: 1fr 6px var(--split-right, 40%);
  height: 100%;
  min-height: 0;
}
.split-left  { min-width: 0; overflow-y: auto; background: hsl(var(--surface)); }
.split-right { min-width: 0; overflow: hidden; background: hsl(var(--surface)); border-left: 1px solid hsl(var(--border)); }
.split-divider {
  cursor: col-resize;
  background: hsl(var(--border));
  position: relative;
  transition: background var(--dur-fast) var(--ease);
}
.split-divider:hover, .split-divider.is-dragging { background: hsl(var(--accent) / 0.6); }
.split-divider::after {                 /* a wider invisible grab target */
  content: ""; position: absolute; inset: 0 -5px;
}

/* ── Theme toggle — a small fixed button every prototype drops in ────────── */
.theme-toggle {
  position: fixed; top: 16px; right: 16px; z-index: 50;
  display: grid; place-items: center;
  width: 36px; height: 36px;
  border: 1px solid hsl(var(--border));
  background: hsl(var(--surface-raised));
  color: hsl(var(--text-muted));
  border-radius: var(--radius);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.theme-toggle:hover { color: hsl(var(--text)); border-color: hsl(var(--accent) / 0.5); }
.theme-toggle svg { width: 18px; height: 18px; }

/* ── Small shared primitives the demos reuse ─────────────────────────────── */
.card {
  background: hsl(var(--surface-sunken));
  border: 1px solid hsl(var(--border));
  border-radius: 10px;
  padding: 16px;
}
.muted { color: hsl(var(--text-muted)); }
.kbd {
  font-family: var(--font-mono); font-size: 11px;
  padding: 1px 5px; border: 1px solid hsl(var(--border));
  border-bottom-width: 2px; border-radius: 4px;
  background: hsl(var(--surface-raised)); color: hsl(var(--text-muted));
}

</style>
  <style>
    /* ─────────────────────────────────────────────────────────────────────
       Transcription queue prototype (v3 — full living experience).
       Flow: drawer starts CLOSED → click the sync rune → full cloud details +
       the Transcribe queue. Press ▶ on a row → pick a model → it transcribes
       for real-feeling: ring + climbing % + a live streaming partial transcript
       + an equalizer. One at a time; pause/hold/resume; done → row drops out.
       "Back up now" runs a live backup animation so the cloud side is alive too.
       ───────────────────────────────────────────────────────────────────── */
    .stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .mock-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid hsl(var(--border)); }
    .mock-brand { font-size: 14px; color: hsl(var(--text-muted)); }
    .mock-body { flex: 1 1 auto; overflow: auto; padding: 32px max(16px, 5vw); }
    .mock-body h1 { font-size: 24px; margin: 0 0 8px; }
    .mock-body p { max-width: 60ch; color: hsl(var(--text) / 0.72); margin: 0 0 14px; }
    .mock-body .cue { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: hsl(var(--accent)); }
    .mock-body .cue svg { width: 18px; height: 18px; }

    /* sync rune (reuses the kit .sync-icon; add the syncing animation here) */
    .rune-btn { position: relative; display: inline-grid; place-items: center; width: 34px; height: 34px; border: none; background: transparent; color: hsl(var(--text-muted)); border-radius: var(--radius); cursor: pointer; }
    .rune-btn:hover, .rune-btn.is-open { background: hsl(var(--surface-raised)); color: hsl(var(--text)); }
    .rune-btn .nub { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--accent)); box-shadow: 0 0 0 2px hsl(var(--surface)); }
    .sync-icon[data-state="syncing"] svg { animation: spin 1.6s linear infinite; color: hsl(var(--accent)); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Drawer ─────────────────────────────────────────────────────────── */
    .sync-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 352px; z-index: 40; display: flex; flex-direction: column; background: hsl(var(--surface-raised)); border-left: 1px solid hsl(var(--border)); transform: translateX(100%); transition: transform var(--dur-slow) var(--ease); }
    .sync-drawer.is-open { transform: translateX(0); }

    .sync-region { flex: 0 0 auto; border-bottom: 1px solid hsl(var(--border)); padding: 14px; }
    .sync-top { display: flex; align-items: flex-start; gap: 10px; }
    .sync-top .sync-icon { margin-top: 1px; color: hsl(var(--text-muted)); }
    .sync-title { font-size: 14px; color: hsl(var(--text)); margin: 0; }
    .sync-subtle { font-size: 11px; color: hsl(var(--text-muted)); margin: 2px 0 0; }
    .sync-collapse { margin-left: auto; border: none; background: transparent; color: hsl(var(--text-muted)); cursor: pointer; border-radius: var(--radius); display: grid; place-items: center; width: 24px; height: 24px; }
    .sync-collapse svg { width: 14px; height: 14px; transition: transform var(--dur) var(--ease); }
    .sync-region[data-collapsed="true"] .sync-collapse svg { transform: rotate(180deg); }
    .sync-region[data-collapsed="true"] .sync-detail { display: none; }

    .sync-transfer { display: none; align-items: center; gap: 9px; margin-top: 12px; }
    .sync-region.is-syncing .sync-transfer { display: flex; }
    .sync-flask { position: relative; width: 20px; height: 26px; border: 1.5px solid hsl(var(--text-muted)); border-radius: 4px 4px 7px 7px; overflow: hidden; flex: 0 0 auto; }
    .sync-flask > i { position: absolute; left: 0; right: 0; bottom: 0; background: hsl(var(--accent) / 0.55); transition: height 300ms var(--ease); }
    .sync-transfer .tx { min-width: 0; }
    .sync-transfer .tx p { margin: 0; font-size: 11px; color: hsl(var(--text)); }
    .sync-transfer .tx .fn { color: hsl(var(--text-muted)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .sync-meter { height: 6px; border-radius: 999px; background: hsl(var(--surface-sunken)); overflow: hidden; margin: 12px 0 4px; }
    .sync-meter > i { display: block; height: 100%; width: 41%; background: hsl(var(--text-muted) / 0.5); transition: width 300ms var(--ease); }
    .sync-btn { display: inline-flex; width: 100%; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; padding: 7px 12px; border: 1px solid hsl(var(--border)); background: hsl(var(--surface)); color: hsl(var(--text)); border-radius: var(--radius); font-size: 14px; cursor: pointer; }
    .sync-btn:hover { background: hsl(var(--surface-sunken)); }
    .sync-btn[disabled] { opacity: .5; cursor: default; }
    .sync-sub { margin-top: 12px; padding-top: 10px; border-top: 1px solid hsl(var(--border)); display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: hsl(var(--text-muted)); }
    .sync-sub a { color: hsl(var(--text-muted)); cursor: pointer; }

    /* ── Process queue ───────────────────────────────────────────────────── */
    .tq { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .tq[hidden] { display: none; }                    /* nothing to process → section vanishes */
    .tq-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: hsl(var(--surface-raised)); border-bottom: 1px solid hsl(var(--border)); }
    .tq-head .ttl { font-size: 14px; color: hsl(var(--text)); margin-right: auto; }

    /* mode toggle — 1 = process only the top item then pause · → = run down the whole queue */
    .tq-mode { display: inline-grid; place-items: center; min-width: 20px; height: 28px; padding: 0 4px; border: none; background: transparent; color: hsl(var(--text-muted)); cursor: pointer; font-family: var(--font-mono); font-size: 17px; line-height: 1; font-weight: 600; }
    .tq-mode:hover { color: hsl(var(--accent)); }

    /* global run/pause — drives the queue per the mode */
    .tq-go { display: inline-grid; place-items: center; width: 34px; height: 28px; border: none; background: hsl(var(--accent)); color: hsl(var(--surface)); border-radius: var(--radius); cursor: pointer; }
    .tq-go:hover { background: hsl(var(--accent-glow)); }
    .tq-go svg { width: 15px; height: 15px; }
    .tq.is-running .tq-go { box-shadow: 0 0 16px -4px hsl(var(--accent-glow) / 0.7); }

    .tq-banner[hidden] { display: none; }
    .tq-banner { display: flex; align-items: center; gap: 8px; margin: 8px; padding: 7px 10px; background: hsl(var(--accent) / 0.06); border-radius: var(--radius); font-size: 11px; color: hsl(var(--text-muted)); }
    .tq-banner button { margin-left: auto; border: none; background: transparent; color: hsl(var(--text-muted)); cursor: pointer; font-size: 14px; }
    .tq-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px; }

    /* ════════════════════════════════════════════════════════════════════════
       PROCESS ROW — the reusable unit of ANY processing queue (audio today;
       images / video / OCR later). Standard layout, left → right:
         [order#] · [type affordances] · [label] · [meta] · [% while running]
       + a thin progress line along the row's bottom edge while running.
       Type-specific bits (audio's preview ▶ and model badge) are injected by
       the ROW_TYPES registry — the shell stays type-agnostic.
       ════════════════════════════════════════════════════════════════════════ */
    .tq-row { position: relative; display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 9px; min-height: 42px; }
    .tq-row + .tq-row { border-top: 1px solid hsl(var(--border) / 0.6); }
    .tq-row.is-active { background: hsl(var(--accent) / 0.06); }
    .tq-row.is-leaving { overflow: hidden; }

    /* order number — click to renumber (reorder the queue) */
    .tq-ord { flex: 0 0 auto; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid hsl(var(--border)); border-radius: 999px; background: hsl(var(--surface)); color: hsl(var(--text-muted)); font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; padding: 0; }
    .tq-ord:hover { color: hsl(var(--text)); border-color: hsl(var(--accent) / 0.6); }
    .tq-row.is-active .tq-ord { background: hsl(var(--accent)); border-color: hsl(var(--accent)); color: hsl(var(--surface)); }
    .tq-ord-input { flex: 0 0 auto; width: 24px; height: 24px; text-align: center; border: 1px solid hsl(var(--accent)); border-radius: 999px; background: hsl(var(--surface)); color: hsl(var(--text)); font-family: var(--font-mono); font-size: 12px; padding: 0; -moz-appearance: textfield; }

    /* audio preview — hear the recording (independent of processing) */
    .tq-prev { flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center; border: none; background: transparent; color: hsl(var(--text-muted)); border-radius: 50%; cursor: pointer; }
    .tq-prev:hover { background: hsl(var(--accent) / 0.12); color: hsl(var(--text)); }
    .tq-prev.is-playing { color: hsl(var(--accent)); background: hsl(var(--accent) / 0.12); }
    .tq-prev svg { width: 15px; height: 15px; }

    .tq-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: hsl(var(--text)); }
    .tq-row.is-filename .tq-label { font-family: var(--font-mono); font-size: 12px; color: hsl(var(--text-muted)); }

    /* per-row model badge (audio only) — tap to switch this file's model */
    .tq-model { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 2px; border: 1px solid hsl(var(--border)); background: hsl(var(--surface)); color: hsl(var(--text-muted)); border-radius: 999px; padding: 1px 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; }
    .tq-model:hover { color: hsl(var(--text)); border-color: hsl(var(--accent) / 0.6); }
    .tq-model svg { width: 9px; height: 9px; opacity: 0.7; }

    .tq-dur { flex: 0 0 auto; font-family: var(--font-mono); font-size: 12px; color: hsl(var(--text-muted)); font-variant-numeric: tabular-nums; }
    .tq-pct { flex: 0 0 auto; width: 38px; text-align: right; font-family: var(--font-mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: hsl(var(--accent)); }
    .tq-err { flex: 0 0 auto; display: inline-flex; color: hsl(var(--danger)); }
    .tq-err svg { width: 16px; height: 16px; }

    /* thin running line along the bottom (replaces the per-row ring) */
    .tq-prog { position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; border-radius: 2px; background: hsl(var(--border) / 0.7); overflow: hidden; }
    .tq-prog > i { display: block; height: 100%; width: 0; background: hsl(var(--accent)); transition: width 160ms linear; }

    /* model picker menu — lift above the z-index:40 drawer (else it opens behind it) */
    .audio-menu.tq-choose { min-width: 13rem; z-index: 60; }
    .audio-menu-backdrop { z-index: 50; }
    .audio-menu.tq-choose button { justify-content: space-between; }
    .tq-choose .sub { font-size: 11px; color: hsl(var(--text-muted)); }
    .tq-choose .cancel { color: hsl(var(--text-muted)); }

    .demo { position: fixed;    .demo { position: fixed; left: 16px; bottom: 16px; z-index: 55; display: flex; gap: 14px; align-items: center; padding: 8px 12px; background: hsl(var(--surface-raised) / 0.94); backdrop-filter: blur(8px); border: 1px solid hsl(var(--border)); border-radius: var(--radius); font-size: 11px; color: hsl(var(--text-muted)); }
    .demo label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
    .demo button { border: 1px solid hsl(var(--border)); background: hsl(var(--surface)); color: hsl(var(--text)); border-radius: var(--radius); padding: 4px 9px; font-size: 11px; cursor: pointer; }
    .demo .sep { width: 1px; height: 18px; background: hsl(var(--border)); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="mock-header">
      <span class="mock-brand">Pensieve</span>
      <button class="rune-btn" id="rune" title="Sync & transcription" aria-label="Sync & transcription">
        <span class="sync-icon" id="rune-icon" data-state="rest" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.6 1.4A3.5 3.5 0 0 1 17 16H6z"/></svg></span>
        <span class="nub" id="nub"></span>
      </button>
    </div>
    <div class="mock-body">
      <h1>Pensieve</h1>
      <p>A couple of recordings are logged but not transcribed yet.</p>
      <p class="cue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Start here → click the cloud rune, top-right.
      </p>
    </div>
  </div>

  <aside class="sync-drawer" id="drawer" aria-label="Sync and transcription">
    <div class="sync-region" id="sync-region" data-collapsed="false">
      <div class="sync-top">
        <span class="sync-icon" id="sync-glyph" data-state="rest" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.6 1.4A3.5 3.5 0 0 1 17 16H6z"/></svg></span>
        <div style="min-width:0">
          <p class="sync-title" id="sync-title">All backed up</p>
          <p class="sync-subtle" id="sync-subtle">Last backed up · 2m ago</p>
        </div>
        <button class="sync-collapse" id="sync-collapse" title="Collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      </div>
      <div class="sync-detail">
        <div class="sync-transfer" id="sync-transfer">
          <span class="sync-flask"><i id="flask-fill" style="height:0%"></i></span>
          <div class="tx"><p id="tx-count">↑ 1 of 8</p><p class="fn" id="tx-name">Call with Dominik.m4a</p></div>
        </div>
        <div class="sync-meter"><i id="meter"></i></div>
        <p class="t-micro muted" style="margin:0" id="space">4.1 GB of 100 GB</p>
        <button class="sync-btn" id="backup">Back up now <span class="kbd">⌘S</span></button>
        <div class="sync-sub"><span class="muted">jakub@icloud.com</span><a>Sign out</a></div>
      </div>
    </div>

    <section class="tq" id="tqsec">
      <header class="tq-head">
        <span class="ttl">Process</span>
        <button class="tq-mode" id="mode" title="Mode"></button>
        <button class="tq-go" id="go" title="Run / pause"></button>
      </header>
      <div class="tq-banner" id="banner" hidden><span class="dot"></span><span>Preparing the transcriber · 1.2 / 6&nbsp;GB</span><button id="banner-x" title="Hide">×</button></div>
      <div class="tq-list" id="list"></div>
    </section>
  </aside>


  <script>
  /* ════════════════════════════════════════════════════════════════════════
     Process queue — global Run/Pause + mode, ordered rows, one at a time.
       · Rows are ordered by a number you can edit (click it → type a new rank).
       · Run/Pause is GLOBAL. Mode "1" processes only the top item then pauses;
         mode "→" runs down the whole queue.
       · Reordering while paused only changes order; while running, the new top
         begins immediately (the previous one freezes, keeping its %).
       · The ROW is a standalone, reusable unit (see ROW_TYPES) — audio adds a
         preview ▶ and a model badge; other types will plug in later.
     ════════════════════════════════════════════════════════════════════════ */
  const MODELS = {
    "czech-whisper": { short: "CZ", choiceLabel: "Czech Mix (Slow)", sub: "best accuracy" },
    "parakeet":      { short: "EN", choiceLabel: "English (Fast)",   sub: "quick, clear speech" },
  };
  const GLYPH = {
    play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
    chev:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    warn:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  };

  // Type registry — what affordances a row gets. The row shell is type-agnostic.
  const ROW_TYPES = {
    audio: { preview: true, model: true },
    // future: image: { preview:false, model:false }, video: {...}
  };

  const SEED = [
    { id: "q1", type: "audio", label: "Call with Dominik about the Q4 roadmap and the client proposal", isFile: false, dur: "6:12", added: "Oct 18 · 2:14 PM" },
    { id: "q2", type: "audio", label: "rec-0048.m4a",  isFile: true,  dur: "0:48", added: "Oct 18 · 1:52 PM" },
    { id: "q3", type: "audio", label: "Standup notes", isFile: false, dur: "2:48", added: "Oct 17 · 9:03 AM" },
  ];

  const $ = (id) => document.getElementById(id);
  const list = () => $("list");
  const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };

  let Q;                       // items (each: {..., order, pct, error})
  let playing = false;         // global run state
  let mode = "all";            // "all" (→) | "one" (1)
  let previewId = null;        // which row is previewing audio
  let ticker = null;
  const leaving = new Set();   // ids mid drop-out animation

  const sorted = () => [...Q].sort((a, b) => a.order - b.order);
  const activeItem = () => sorted().filter((x) => !leaving.has(x.id))[0] || null;

  function renumber() { sorted().forEach((x, i) => (x.order = i + 1)); }

  function reset() {
    Q = SEED.map((x, i) => ({ ...x, order: i + 1, pct: 0, error: false, model: "czech-whisper" }));
    playing = false; mode = "all"; previewId = null;
    stopTick(); closeChoice();
    render();
  }

  /* ── model picker (reused for each row's badge) ── */
  function closeChoice() { document.querySelectorAll(".audio-menu.tq-choose,.audio-menu-backdrop").forEach((n) => n.remove()); }
  function openChoice(anchor, current, onPick) {
    closeChoice();
    const back = el('<div class="audio-menu-backdrop"></div>'); back.onclick = closeChoice; document.body.appendChild(back);
    const item = (id) => `<button role="menuitem" data-m="${id}"><span>${MODELS[id].choiceLabel}${current === id ? " ✓" : ""}</span><span class="sub">${MODELS[id].sub}</span></button>`;
    const menu = el(`<div class="audio-menu tq-choose" role="menu">${item("czech-whisper")}${item("parakeet")}<div class="audio-menu-sep"></div><button role="menuitem" class="cancel" data-m="">Cancel</button></div>`);
    document.body.appendChild(menu);
    const r = anchor.getBoundingClientRect();
    menu.style.position = "fixed";
    menu.style.top = Math.min(r.bottom + 6, innerHeight - menu.offsetHeight - 8) + "px";
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px";
    menu.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { const m = b.dataset.m; closeChoice(); if (m) onPick(m); }));
    (menu.querySelector(`[data-m="${current}"]`) || menu.querySelector("[data-m]")).focus();
  }

  /* ── processing loop ── */
  function setPlaying(p) {
    playing = p;
    if (playing) { const it = activeItem(); if (it && it.error) it.error = false; }
    render(); tick();
  }
  function stopTick() { if (ticker) { clearInterval(ticker); ticker = null; } }
  function tick() {
    if (ticker || !playing) return;
    ticker = setInterval(() => {
      if (!playing) return stopTick();
      const it = activeItem();
      if (!it) { stopTick(); return; }
      if (it.pct >= 100) return;                          // waiting on drop-out
      it.pct = Math.min(100, it.pct + 3);                 // prototype pace
      if (it.pct >= 100) finish(it); else renderLive(it);
    }, 150);
  }
  function finish(it) {
    stopTick();
    it.pct = 100; renderLive(it);
    leaving.add(it.id);
    const row = list().querySelector(`.tq-row[data-id="${it.id}"]`);
    const drop = () => {
      leaving.delete(it.id);
      if (row) row.remove();                              // actually leave the DOM (not just the model)
      Q = Q.filter((x) => x.id !== it.id);
      renumber();
      if (mode === "one") playing = false;                // single-shot: stop after one
      render();
      if (playing) tick();
    };
    if (row) {
      row.classList.add("is-leaving");
      row.style.transition = "all var(--dur-slow) var(--ease)";
      row.style.maxHeight = row.offsetHeight + "px";
      requestAnimationFrame(() => { row.style.maxHeight = "0"; row.style.opacity = "0"; row.style.marginTop = "0"; row.style.paddingTop = "0"; row.style.paddingBottom = "0"; });
      setTimeout(drop, 340);
    } else drop();
  }

  /* ── reorder by typing a new position ── */
  function reorder(id, pos) {
    const arr = sorted();
    const idx = arr.findIndex((x) => x.id === id);
    if (idx < 0) return render();
    const [item] = arr.splice(idx, 1);
    pos = Math.max(1, Math.min(arr.length + 1, pos | 0));
    arr.splice(pos - 1, 0, item);
    arr.forEach((x, i) => (x.order = i + 1));
    render();
    if (playing) { const it = activeItem(); if (it && it.error) it.error = false; tick(); }
  }
  function startEdit(it, btn) {
    const input = el(`<input class="tq-ord-input" type="text" inputmode="numeric" value="${it.order}" aria-label="New position">`);
    btn.replaceWith(input);
    input.focus(); input.select();
    let done = false;
    const commit = (apply) => { if (done) return; done = true; const v = parseInt(input.value, 10); if (apply && !isNaN(v)) reorder(it.id, v); else render(); };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(true); }
      else if (e.key === "Escape") { e.preventDefault(); commit(false); }
    });
    input.addEventListener("blur", () => commit(true));
  }

  function togglePreview(id) { previewId = previewId === id ? null : id; render(); }

  /* ── render ── */
  function rowHtml(it) {
    const t = ROW_TYPES[it.type] || {};
    const isActive = activeItem() && activeItem().id === it.id;
    const preview = t.preview
      ? `<button class="tq-prev ${previewId === it.id ? "is-playing" : ""}" data-act="prev" title="${previewId === it.id ? "Pause preview" : "Play recording"}" aria-label="Play recording">${previewId === it.id ? GLYPH.pause : GLYPH.play}</button>`
      : "";
    const badge = t.model
      ? `<button class="tq-model" data-act="model" title="Model: ${MODELS[it.model].choiceLabel}">${MODELS[it.model].short}${GLYPH.chev}</button>`
      : "";
    // show % as soon as a row is processing (active + running), not only once pct>0 —
    // otherwise the per-tick live update has no element to write into.
    const showPct = !it.error && (it.pct > 0 || (isActive && playing));
    const err = it.error ? `<span class="tq-err" title="Couldn't process — press Run to retry">${GLYPH.warn}</span>` : "";
    const tip = `${it.label}\nAdded to queue · ${it.added}`;
    return `
      <button class="tq-ord" data-act="ord" title="Reorder — type a new position">${it.order}</button>
      <span class="tq-label" title="${tip}">${it.label}</span>
      ${preview}
      ${badge}
      <span class="tq-dur">${it.dur}</span>
      ${showPct ? `<span class="tq-pct">${Math.round(it.pct)}%</span>` : ""}
      ${err}
      ${showPct ? `<div class="tq-prog"><i style="width:${it.pct}%"></i></div>` : ""}`;
  }
  function renderLive(it) {
    const row = list().querySelector(`.tq-row[data-id="${it.id}"]`);
    if (!row) return render();
    const p = row.querySelector(".tq-pct"); if (p) p.textContent = Math.round(it.pct) + "%";
    const f = row.querySelector(".tq-prog > i"); if (f) f.style.width = it.pct + "%";
  }
  function render() {
    $("tqsec").hidden = Q.length === 0;                   // nothing to process → section vanishes
    $("tqsec").classList.toggle("is-running", playing);
    $("mode").textContent = mode === "one" ? "1" : "→";
    $("mode").title = mode === "one" ? "Mode: one — process the top item, then pause" : "Mode: all — run down the whole queue";
    $("go").innerHTML = playing ? GLYPH.pause : GLYPH.play;
    $("go").title = playing ? "Pause" : "Run";

    const L = list();
    const keep = [...L.querySelectorAll(".tq-row.is-leaving")].filter((n) => leaving.has(n.dataset.id));
    L.innerHTML = "";
    sorted().filter((x) => !leaving.has(x.id)).forEach((it) => {
      const active = activeItem() && activeItem().id === it.id;
      const row = el(`<div class="tq-row ${it.isFile ? "is-filename" : ""} ${active ? "is-active" : ""}" data-id="${it.id}" data-type="${it.type}">${rowHtml(it)}</div>`);
      row.querySelector('[data-act="ord"]').addEventListener("click", (e) => { e.stopPropagation(); startEdit(it, e.currentTarget); });
      row.querySelector('[data-act="prev"]')?.addEventListener("click", (e) => { e.stopPropagation(); togglePreview(it.id); });
      row.querySelector('[data-act="model"]')?.addEventListener("click", (e) => { e.stopPropagation(); openChoice(e.currentTarget, it.model, (m) => { if (m !== it.model) { it.model = m; it.pct = 0; it.error = false; } render(); if (playing) tick(); }); });
      L.appendChild(row);
    });
    keep.forEach((n) => L.appendChild(n));
  }

  /* ── live BACKUP animation (keeps the cloud side alive) ── */
  let syncing = false;
  function runBackup() {
    if (syncing) return; syncing = true;
    const region = $("sync-region"), total = 8; let done = 0;
    region.classList.add("is-syncing");
    $("rune-icon").dataset.state = "syncing"; $("sync-glyph").dataset.state = "syncing";
    $("sync-title").textContent = "Backing up…"; $("sync-subtle").textContent = "Uploading new recordings";
    $("backup").disabled = true;
    const names = ["Call with Dominik.m4a", "rec-0048.m4a", "Standup notes.md", "photo-14.jpg", "thursday.md"];
    const iv = setInterval(() => {
      done++;
      $("tx-count").textContent = `↑ ${done} of ${total}`;
      $("tx-name").textContent = names[done % names.length];
      $("flask-fill").style.height = Math.round((done / total) * 100) + "%";
      $("meter").style.width = (41 + done) + "%";
      if (done >= total) {
        clearInterval(iv); syncing = false;
        region.classList.remove("is-syncing");
        $("rune-icon").dataset.state = "rest"; $("sync-glyph").dataset.state = "rest";
        $("sync-title").textContent = "All backed up"; $("sync-subtle").textContent = "Last backed up · just now";
        $("backup").disabled = false; $("nub").style.display = "none";
      }
    }, 300);
  }

  /* ── events ── */
  $("mode").onclick = () => { mode = mode === "one" ? "all" : "one"; render(); };
  $("go").onclick = () => setPlaying(!playing);
  $("rune").onclick = () => { const open = $("drawer").classList.toggle("is-open"); $("rune").classList.toggle("is-open", open); if (open) $("nub").style.display = "none"; };
  $("sync-collapse").onclick = () => { const r = $("sync-region"); r.dataset.collapsed = r.dataset.collapsed === "true" ? "false" : "true"; };
  $("backup").onclick = runBackup;
  $("banner-x").onclick = () => ($("banner").hidden = true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeChoice(); });

  reset();

  </script>
</body>
</html>
