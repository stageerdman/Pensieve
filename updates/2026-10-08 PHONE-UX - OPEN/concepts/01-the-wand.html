<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Pensieve — The Wand</title>
<style>
/* ============================================================================
   PENSIEVE · PHONE CONCEPT 01 · "THE WAND"
   Capture-first, one-thumb. Everything lives at the bottom command zone.
   Self-contained: no network, no fonts, no CDNs. SVG drawn inline.
   ========================================================================== */

/* ---- Design tokens (match the desktop Basin exactly) --------------------- */
:root{
  /* Dark "Basin" surfaces */
  --surface:          222 24% 11%;
  --surface-sunken:   222 22% 13%;
  --surface-raised:   222 18% 17%;
  --text:             216 18% 84%;
  --text-muted:       218 12% 60%;
  --border:           222 16% 21%;
  --accent:           215 85% 74%;
  --accent-glow:      218 100% 72%;
  --gold:             43 92% 55%;

  /* Category hues (liquid colours) */
  --cat-blue:   212 70% 68%;
  --cat-purple: 270 55% 74%;
  --cat-green:  145 50% 62%;
  --cat-pink:   330 60% 74%;
  --cat-orange: 24 85% 68%;
  --cat-yellow: 45 80% 66%;
  --cat-red:    0 70% 70%;

  --font: -apple-system, "SF Pro Text", system-ui, sans-serif;
  --radius: 14px;

  /* motion */
  --spring: cubic-bezier(.22,1,.36,1);
  --spring-soft: cubic-bezier(.34,1.56,.64,1);
  --ease: cubic-bezier(.4,0,.2,1);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 800px at 50% -10%, #11182400, #0a0e14 70%),
    #0a0e14;
  color:hsl(var(--text));
  display:flex; align-items:center; justify-content:center;
  min-height:100dvh;
  padding:24px;
  overflow:hidden;
}

/* ===========================================================================
   DEVICE FRAME — reads as an iPhone on desktop; fills the screen on a phone
   =========================================================================== */
.device{
  position:relative;
  width:390px; height:844px;
  border-radius:54px;
  background:#000;
  padding:11px;
  box-shadow:
    0 0 0 2px #1c222c,
    0 0 0 11px #05070a,
    0 40px 120px -20px rgba(0,0,0,.9),
    0 0 90px -20px hsl(var(--accent-glow)/.18);
  flex:none;
}
/* On a real phone, let the app fill the viewport (no bezel). */
@media (max-width:420px), (display-mode:standalone){
  body{ padding:0; }
  .device{
    width:100vw; height:100dvh;
    border-radius:0; padding:0;
    box-shadow:none;
  }
  .screen{ border-radius:0; }
}

.screen{
  position:relative;
  width:100%; height:100%;
  border-radius:44px;
  overflow:hidden;
  background:hsl(var(--surface));
  /* subtle living nebula so the Basin feels deep, not flat */
  background-image:
    radial-gradient(120% 70% at 20% -5%, hsl(var(--accent-glow)/.10), transparent 55%),
    radial-gradient(90% 60% at 95% 8%, hsl(var(--cat-purple)/.08), transparent 50%),
    radial-gradient(140% 90% at 50% 120%, hsl(218 60% 20% /.35), transparent 60%);
  isolation:isolate;
}

/* ---- Status bar ---------------------------------------------------------- */
.statusbar{
  position:absolute; top:0; left:0; right:0; height:54px;
  padding:0 30px;
  display:flex; align-items:center; justify-content:space-between;
  font-size:15px; font-weight:600; letter-spacing:.2px;
  color:hsl(var(--text));
  z-index:60; pointer-events:none;
  padding-top:env(safe-area-inset-top);
}
.statusbar .right{ display:flex; gap:7px; align-items:center; }
.statusbar svg{ display:block; }

/* ---- Home indicator ------------------------------------------------------ */
.home-indicator{
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  width:134px; height:5px; border-radius:3px;
  background:hsl(var(--text)/.5);
  z-index:70; pointer-events:none;
}

/* ===========================================================================
   APP SHELL
   =========================================================================== */
.app{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding-top:calc(54px + env(safe-area-inset-top));
}

/* ---- Header (whisper-light) --------------------------------------------- */
.header{
  padding:10px 24px 6px;
  display:flex; align-items:baseline; justify-content:space-between;
  flex:none;
}
.header h1{
  margin:0; font-size:26px; font-weight:700; letter-spacing:-.4px;
  color:hsl(var(--text));
}
.header .count{
  font-size:13px; color:hsl(var(--text-muted));
  font-variant-numeric:tabular-nums;
}

/* ===========================================================================
   THE FLASK STREAM (reel) — top card is the magnified "active" one
   =========================================================================== */
.stream{
  flex:1; min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  padding:4px 18px 240px;    /* bottom room for the command zone */
  scrollbar-width:none;
}
.stream::-webkit-scrollbar{ display:none; }

.flask-card{
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex; align-items:center; gap:16px;
  padding:14px 16px;
  margin:8px 0;
  border-radius:var(--radius);
  background:hsl(var(--surface-raised)/0);
  border:1px solid transparent;
  transition:
    transform .5s var(--spring),
    opacity .5s var(--ease),
    background .5s var(--ease),
    border-color .5s var(--ease),
    box-shadow .5s var(--ease),
    padding .5s var(--spring);
  transform-origin:left center;
  will-change:transform,opacity;
  cursor:pointer;
}
/* Neighbours: small, quiet — just title + date */
.flask-card .body .snippet{
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height .5s var(--spring), opacity .35s var(--ease), margin .5s var(--spring);
  font-size:14px; line-height:1.45; color:hsl(var(--text-muted));
}
.flask-card .svg-wrap{ width:46px; height:60px; flex:none; transition:all .5s var(--spring); }
.flask-card .title{ font-size:15px; font-weight:600; color:hsl(var(--text)); letter-spacing:-.2px; transition:font-size .5s var(--spring); }
.flask-card .meta{ font-size:12px; color:hsl(var(--text-muted)); margin-top:2px; }
.flask-card .body{ min-width:0; flex:1; }
.flask-card .title{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ACTIVE card = magnified, glowing, shows a slice of content */
.flask-card.active{
  background:
    linear-gradient(180deg, hsl(var(--surface-raised)/.9), hsl(var(--surface-sunken)/.9));
  border-color:hsl(var(--border));
  box-shadow:
    0 18px 50px -24px rgba(0,0,0,.8),
    inset 0 1px 0 hsl(var(--text)/.05);
  padding:22px 18px;
}
.flask-card.active .svg-wrap{ width:72px; height:94px; }
.flask-card.active .title{ font-size:19px; font-weight:700; white-space:normal; }
.flask-card.active .body .snippet{
  max-height:80px; opacity:1; margin-top:8px;
}
.flask-card:not(.active){ opacity:.52; transform:scale(.965); }
.flask-card:not(.active):hover{ opacity:.75; }

/* hidden by Accio filter */
.flask-card.filtered{
  display:none;
}

/* ===========================================================================
   BOTTOM COMMAND ZONE — the signature idea. Everything under the thumb.
   =========================================================================== */
.command-zone{
  position:absolute; left:0; right:0; bottom:0;
  padding:0 20px calc(26px + env(safe-area-inset-bottom));
  z-index:50;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  pointer-events:none;
  /* fade the stream into the zone */
  background:linear-gradient(180deg, transparent, hsl(var(--surface)/.86) 38%, hsl(var(--surface)) 72%);
  padding-top:70px;
}
.command-zone > *{ pointer-events:auto; }

/* The Accio summon pill (collapsed state: a slim bar beside the wand) */
.dock{
  width:100%;
  display:flex; align-items:center; gap:14px;
}

.accio-pill{
  flex:1; height:58px;
  display:flex; align-items:center; gap:12px;
  padding:0 20px;
  border-radius:29px;
  background:hsl(var(--surface-raised)/.72);
  border:1px solid hsl(var(--border));
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  color:hsl(var(--text-muted));
  font-size:16px;
  transition:transform .4s var(--spring), box-shadow .4s var(--ease);
  box-shadow:0 10px 30px -14px rgba(0,0,0,.7);
}
.accio-pill:active{ transform:scale(.97); }
.accio-pill .label{ flex:1; text-align:left; }
.accio-pill .mic{ color:hsl(var(--text-muted)); display:flex; }

/* The WAND — the hero. Tap conjures a note; hold speaks. */
.wand{
  width:66px; height:66px; flex:none;
  border-radius:50%;
  border:none;
  position:relative;
  background:
    radial-gradient(130% 130% at 30% 25%, hsl(var(--accent)) 0%, hsl(var(--accent-glow)) 55%, hsl(215 80% 52%) 100%);
  box-shadow:
    0 0 0 1px hsl(var(--accent-glow)/.5),
    0 14px 34px -8px hsl(var(--accent-glow)/.6),
    inset 0 2px 4px hsl(0 0% 100% /.4),
    inset 0 -6px 12px hsl(215 80% 40% /.5);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:transform .35s var(--spring-soft), box-shadow .35s var(--ease);
  overflow:visible;
}
.wand:active{ transform:scale(.9); }
.wand.holding{
  transform:scale(1.08);
  box-shadow:
    0 0 0 1px hsl(var(--accent-glow)/.6),
    0 0 44px 4px hsl(var(--accent-glow)/.55),
    inset 0 2px 4px hsl(0 0% 100% /.5);
}
/* breathing aura */
.wand::before{
  content:""; position:absolute; inset:-10px; border-radius:50%;
  background:radial-gradient(circle, hsl(var(--accent-glow)/.35), transparent 70%);
  animation:breathe 4s var(--ease) infinite;
  z-index:-1;
}
@keyframes breathe{ 0%,100%{ transform:scale(.85); opacity:.5;} 50%{ transform:scale(1.1); opacity:.9;} }

/* sync-spell mini button rides above the wand on the right edge */
.sync-btn{
  position:absolute; top:4px; right:20px;
  width:40px; height:40px; border-radius:50%;
  border:1px solid hsl(var(--border));
  background:hsl(var(--surface-raised)/.72);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  color:hsl(var(--text-muted));
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:transform .4s var(--spring), color .4s var(--ease), border-color .4s var(--ease);
  z-index:55;
}
.sync-btn:active{ transform:scale(.9); }
.sync-btn.syncing{ color:hsl(var(--gold)); border-color:hsl(var(--gold)/.5); }

/* hint line under the dock */
.hint{
  font-size:12px; color:hsl(var(--text-muted)/.8);
  letter-spacing:.2px;
}
.hint b{ color:hsl(var(--accent)); font-weight:600; }

/* ===========================================================================
   ACCIO — expanded summon bar overlay
   =========================================================================== */
.accio-overlay{
  position:absolute; inset:0; z-index:80;
  display:flex; flex-direction:column; justify-content:flex-end;
  background:hsl(var(--surface)/0);
  backdrop-filter:blur(0px);
  transition:background .3s var(--ease), backdrop-filter .3s var(--ease);
  pointer-events:none;
  opacity:0;
}
.accio-overlay.open{
  background:hsl(222 28% 7% /.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto; opacity:1;
}
.accio-results{
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:calc(54px + env(safe-area-inset-top)) 18px 20px;
  display:flex; flex-direction:column; justify-content:flex-end;
  gap:6px; scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg, transparent, #000 15%);
  mask-image:linear-gradient(180deg, transparent, #000 15%);
}
.accio-results::-webkit-scrollbar{ display:none; }
.accio-hit{
  display:flex; align-items:center; gap:14px;
  padding:10px 14px; border-radius:12px;
  background:hsl(var(--surface-raised)/.5);
  border:1px solid hsl(var(--border)/.6);
  opacity:0; transform:translateY(8px);
  animation:hitIn .4s var(--spring) forwards;
}
@keyframes hitIn{ to{ opacity:1; transform:none; } }
.accio-hit .svg-wrap{ width:34px; height:44px; flex:none; }
.accio-hit .title{ font-size:15px; font-weight:600; color:hsl(var(--text)); }
.accio-hit .meta{ font-size:12px; color:hsl(var(--text-muted)); }
.accio-hit mark{ background:hsl(var(--gold)/.25); color:hsl(var(--gold)); border-radius:3px; }
.accio-empty{
  text-align:center; color:hsl(var(--text-muted)); font-size:14px; padding:30px;
}

.summon-bar{
  flex:none;
  margin:0 16px calc(24px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px;
  height:60px; padding:0 8px 0 20px;
  border-radius:30px;
  background:hsl(var(--surface-raised)/.95);
  border:1px solid hsl(var(--accent)/.4);
  box-shadow:0 0 40px -6px hsl(var(--accent-glow)/.4), 0 20px 50px -16px rgba(0,0,0,.8);
  transform:translateY(120%);
  transition:transform .5s var(--spring);
}
.accio-overlay.open .summon-bar{ transform:translateY(0); }
.summon-bar input{
  flex:1; background:none; border:none; outline:none;
  color:hsl(var(--text)); font-size:17px; font-family:var(--font);
}
.summon-bar input::placeholder{ color:hsl(var(--text-muted)); }
.summon-bar .mic-btn{
  width:44px; height:44px; border-radius:50%; flex:none;
  border:none; background:hsl(var(--surface-sunken));
  color:hsl(var(--text-muted)); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .3s var(--ease);
}
.summon-bar .mic-btn.listening{
  background:hsl(var(--accent)/.2); color:hsl(var(--accent));
  animation:pulse 1.4s var(--ease) infinite;
}
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 hsl(var(--accent)/.4);} 50%{ box-shadow:0 0 0 10px hsl(var(--accent)/0);} }

/* ===========================================================================
   CAPTURE — the Notes-smooth editor, conjured by the wand
   =========================================================================== */
.editor{
  position:absolute; inset:0; z-index:90;
  background:hsl(var(--surface));
  background-image:
    radial-gradient(120% 60% at 50% -10%, hsl(var(--accent-glow)/.12), transparent 55%);
  display:flex; flex-direction:column;
  transform:translateY(100%);
  transition:transform .55s var(--spring);
  padding-top:calc(54px + env(safe-area-inset-top));
}
.editor.open{ transform:translateY(0); }

.editor-top{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 18px 2px; flex:none;
}
.editor-top button{
  border:none; background:none; cursor:pointer; font-family:var(--font);
  font-size:17px; color:hsl(var(--accent)); font-weight:600; padding:8px;
}
.editor-top .done{ display:flex; align-items:center; gap:6px; }

.editor-surface{
  flex:1; min-height:0; overflow-y:auto;
  padding:14px 24px 24px;
  scrollbar-width:none;
}
.editor-surface::-webkit-scrollbar{ display:none; }
.editor-title{
  font-size:28px; font-weight:700; letter-spacing:-.5px;
  color:hsl(var(--text)); outline:none; margin-bottom:6px;
}
.editor-title:empty::before{
  content:"New thought"; color:hsl(var(--text-muted)/.5);
}
.editor-date{ font-size:13px; color:hsl(var(--text-muted)); margin-bottom:18px; }
.editor-body{
  font-size:17px; line-height:1.6; color:hsl(var(--text)); outline:none;
  min-height:200px;
}
.editor-body:empty::before{
  content:"Start writing…"; color:hsl(var(--text-muted)/.5);
}
.editor-body p{ margin:0 0 .8em; }

/* The "thought-thread" — a luminous strand that the wand draws as it conjures */
.thread-flash{
  position:absolute; inset:0; z-index:95; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}

/* editor mic (capture by voice) */
.editor-mic{
  position:absolute; right:22px; bottom:calc(26px + env(safe-area-inset-bottom));
  width:58px; height:58px; border-radius:50%;
  border:1px solid hsl(var(--border));
  background:hsl(var(--surface-raised));
  color:hsl(var(--text));
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:96;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.7);
  transition:all .3s var(--ease);
}
.editor-mic.listening{
  background:hsl(var(--accent)/.2); color:hsl(var(--accent)); border-color:hsl(var(--accent)/.5);
  animation:pulse 1.4s var(--ease) infinite;
}

/* ===========================================================================
   "POURED INTO A FLASK" — save confirmation
   =========================================================================== */
.toast{
  position:absolute; left:50%; bottom:120px; transform:translate(-50%, 24px);
  z-index:100; pointer-events:none;
  display:flex; align-items:center; gap:12px;
  padding:12px 18px 12px 12px;
  border-radius:40px;
  background:hsl(var(--surface-raised)/.95);
  border:1px solid hsl(var(--gold)/.4);
  box-shadow:0 0 36px -6px hsl(var(--gold)/.35), 0 18px 44px -14px rgba(0,0,0,.8);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  opacity:0; transition:opacity .4s var(--ease), transform .5s var(--spring);
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }
.toast .svg-wrap{ width:34px; height:44px; }
.toast .txt{ font-size:14px; }
.toast .txt b{ color:hsl(var(--gold)); font-weight:600; }
.toast .txt span{ display:block; color:hsl(var(--text-muted)); font-size:12px; }

/* ===========================================================================
   SYNC SPELL — full-surface shimmer + rune ripple
   =========================================================================== */
.sync-spell{
  position:absolute; inset:0; z-index:85; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .4s var(--ease);
}
.sync-spell.show{ opacity:1; }
.sync-ripple{
  position:absolute; border:1.5px solid hsl(var(--gold)/.6); border-radius:50%;
  width:60px; height:60px;
}
.sync-ripple.go{ animation:ripple 1.8s var(--ease) forwards; }
@keyframes ripple{
  from{ transform:scale(.2); opacity:.9; }
  to{ transform:scale(10); opacity:0; }
}
.sync-rune{
  width:70px; height:70px; color:hsl(var(--gold));
  filter:drop-shadow(0 0 16px hsl(var(--gold)/.7));
}
.sync-rune.go{ animation:runeSpin 1.8s var(--spring) forwards; }
@keyframes runeSpin{
  0%{ transform:rotate(0) scale(.4); opacity:0; }
  30%{ opacity:1; }
  70%{ transform:rotate(300deg) scale(1.1); opacity:1; }
  100%{ transform:rotate(360deg) scale(.6); opacity:0; }
}
.sync-label{
  position:absolute; bottom:200px;
  font-size:13px; color:hsl(var(--gold)); letter-spacing:.4px; font-weight:600;
}

/* ===========================================================================
   MOTION-REDUCED: honour the OS preference
   =========================================================================== */
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001s !important; transition-duration:.08s !important; }
  .wand::before{ animation:none; }
}
</style>
</head>
<body>
<div class="device">
  <div class="screen">

    <!-- ============ STATUS BAR ============ -->
    <div class="statusbar">
      <span>9:41</span>
      <div class="right">
        <!-- cellular -->
        <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
        <!-- wifi -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.2c2.6 0 5 1 6.8 2.6l1.4-1.5A11.4 11.4 0 0 0 8.5.2 11.4 11.4 0 0 0 .3 3.3l1.4 1.5A9.4 9.4 0 0 1 8.5 2.2Zm0 3.6c1.6 0 3.1.6 4.2 1.6l1.4-1.5A8 8 0 0 0 8.5 3.6a8 8 0 0 0-5.6 2.3l1.4 1.5a6 6 0 0 1 4.2-1.6Zm0 3.6c.7 0 1.4.3 1.9.8l-1.9 2-1.9-2c.5-.5 1.2-.8 1.9-.8Z"/></svg>
        <!-- battery -->
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor"/><path d="M24 4v4c.9-.3 1.3-1 1.3-2S24.9 4.3 24 4Z" fill="currentColor" fill-opacity=".5"/></svg>
      </div>
    </div>

    <!-- ============ MAIN APP ============ -->
    <div class="app">
      <div class="header">
        <h1>Pensieve</h1>
        <span class="count" id="count">— memories</span>
      </div>

      <!-- THE FLASK STREAM (reel) -->
      <div class="stream" id="stream"><!-- cards injected by JS --></div>
    </div>

    <!-- ============ BOTTOM COMMAND ZONE (the spine) ============ -->
    <div class="command-zone">
      <button class="sync-btn" id="syncBtn" aria-label="Sync">
        <!-- cloud-spark -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A3.5 3.5 0 0 1 17 18H7Z"/><path d="M12 11v4m-2-2h4" stroke-opacity=".7"/></svg>
      </button>

      <div class="dock">
        <button class="accio-pill" id="accioPill">
          <!-- search glyph -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="label">Accio… a memory</span>
          <span class="mic" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
          </span>
        </button>

        <button class="wand" id="wand" aria-label="Conjure a new thought">
          <!-- the wand: a slim stick with a star tip -->
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 19 15 9" stroke-opacity=".95"/>
            <path d="m17 7 .9-.9M17 7l-.9.9M17 7l.9.9M17 7l-.9-.9" transform="translate(-0.5,-0.5) scale(1.15)" stroke-opacity=".9"/>
            <!-- sparkle star tip -->
            <path d="M17.5 4.5v4M15.5 6.5h4" stroke-opacity=".9"/>
            <circle cx="9" cy="15" r=".6" fill="#fff" stroke="none" opacity=".8"/>
          </svg>
        </button>
      </div>

      <div class="hint" id="hint">Tap the wand to write · hold to speak</div>
    </div>

    <!-- ============ ACCIO OVERLAY ============ -->
    <div class="accio-overlay" id="accioOverlay">
      <div class="accio-results" id="accioResults"></div>
      <div class="summon-bar">
        <input id="accioInput" type="text" placeholder="Accio…" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search" />
        <button class="mic-btn" id="accioMic" aria-label="Search by voice">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
        </button>
      </div>
    </div>

    <!-- ============ CAPTURE EDITOR ============ -->
    <div class="editor" id="editor">
      <div class="editor-top">
        <button id="editorClose">Close</button>
        <button class="done" id="editorDone">Pour in
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-11"/></svg>
        </button>
      </div>
      <div class="editor-surface">
        <div class="editor-title" id="editorTitle" contenteditable="true" spellcheck="false"></div>
        <div class="editor-date" id="editorDate"></div>
        <div class="editor-body" id="editorBody" contenteditable="true" spellcheck="false"></div>
      </div>
      <button class="editor-mic" id="editorMic" aria-label="Dictate">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
      </button>
    </div>

    <!-- ============ THREAD FLASH (conjure animation) ============ -->
    <div class="thread-flash" id="threadFlash"></div>

    <!-- ============ TOAST ("poured into a flask") ============ -->
    <div class="toast" id="toast">
      <div class="svg-wrap" id="toastFlask"></div>
      <div class="txt"><b>Poured into a flask</b><span id="toastSub">Saved locally · indexed</span></div>
    </div>

    <!-- ============ SYNC SPELL ============ -->
    <div class="sync-spell" id="syncSpell">
      <div class="sync-ripple" id="syncRipple"></div>
      <svg class="sync-rune" id="syncRune" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="24" r="18" stroke-opacity=".5"/>
        <path d="M24 6v36M6 24h36M11 11l26 26M37 11 11 37" stroke-opacity=".35"/>
        <path d="M24 12l3.2 9.8H37.5l-8.3 6 3.2 9.8-8.3-6-8.3 6 3.2-9.8-8.3-6h10.3z"/>
      </svg>
      <div class="sync-label" id="syncLabel">Weaving to the cloud…</div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>

<script>
/* ============================================================================
   PENSIEVE · "THE WAND" — behaviour
   ========================================================================== */
(() => {
  "use strict";
  const $ = (s, r=document) => r.querySelector(s);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const haptic = (ms=8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

  /* ---- Flask SVG rendering ------------------------------------------------
     Six silhouettes · coloured liquid · radial glow · glass highlight ·
     a faint white "memory thread" strand rising inside. fill 0..1. --------- */
  const SHAPES = ["round","erlenmeyer","vial","potion","teardrop","beaker"];

  function flaskSVG(shape, hue, fill){
    const id = "g"+Math.random().toString(36).slice(2,8);
    const liquid = `hsl(${hue})`;
    const liquidDeep = `hsl(${hue.split(" ")[0]} ${hue.split(" ")[1]} 46%)`;
    // Each shape: [outlinePath, liquidClipPath(viewport-level), neckTopY, bodyBottomY]
    // We draw in a 48x64 viewBox. Liquid is a rect clipped to the vessel body.
    const shapes = {
      round:     { body:"M24 10v10a14 14 0 1 1-0.001 0Z M18 10h12", top:20, bottom:58, clip:"M24 20a14 14 0 1 0 0.001 0Z" },
      erlenmeyer:{ body:"M20 8h8v14l9 30a3 3 0 0 1-3 4H14a3 3 0 0 1-3-4l9-30z M19 8h10", top:22, bottom:54, clip:"M20 22 12 52a3 3 0 0 0 3 4h18a3 3 0 0 0 3-4L28 22z" },
      vial:      { body:"M18 8h12v40a6 6 0 0 1-12 0z M17 8h14", top:18, bottom:52, clip:"M18 18h12v30a6 6 0 0 1-12 0z" },
      potion:    { body:"M21 8h6v6c5 2 9 7 9 14a15 15 0 0 1-30 0c0-7 4-12 9-14z M20 8h8", top:22, bottom:58, clip:"M24 22a13 13 0 1 0 0.001 0Z" },
      teardrop:  { body:"M24 8c6 10 11 17 11 26a11 11 0 0 1-22 0c0-9 5-16 11-26z", top:24, bottom:56, clip:"M24 24c4 6 9 11 9 18a9 9 0 0 1-18 0c0-7 5-12 9-18z" },
      beaker:    { body:"M15 10h18l-2 4v34a4 4 0 0 1-4 4H21a4 4 0 0 1-4-4V14z M14 10h20 M31 20h4", top:18, bottom:52, clip:"M17 18h14v30a4 4 0 0 1-4 4H21a4 4 0 0 1-4-4z" }
    };
    const s = shapes[shape] || shapes.round;
    const fh = (s.bottom - s.top);
    const liquidTop = s.bottom - Math.max(6, fh * Math.max(.12, Math.min(1, fill)));
    return `
    <svg viewBox="0 0 48 68" width="100%" height="100%" aria-hidden="true">
      <defs>
        <radialGradient id="${id}glow" cx="50%" cy="60%" r="60%">
          <stop offset="0%" stop-color="${liquid}" stop-opacity=".55"/>
          <stop offset="100%" stop-color="${liquid}" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="${id}liq" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${liquid}" stop-opacity=".9"/>
          <stop offset="100%" stop-color="${liquidDeep}" stop-opacity=".95"/>
        </linearGradient>
        <clipPath id="${id}clip"><path d="${s.clip}"/></clipPath>
      </defs>
      <!-- soft radial glow -->
      <ellipse cx="24" cy="46" rx="22" ry="22" fill="url(#${id}glow)"/>
      <!-- liquid (clipped to body) + memory thread -->
      <g clip-path="url(#${id}clip)">
        <rect x="0" y="${liquidTop}" width="48" height="${s.bottom-liquidTop+2}" fill="url(#${id}liq)"/>
        <!-- surface shimmer -->
        <rect x="0" y="${liquidTop}" width="48" height="2" fill="#fff" opacity=".25"/>
        <!-- the faint white memory thread rising inside -->
        <path d="M24 ${s.bottom} C 20 ${s.bottom-10}, 28 ${s.bottom-16}, 23 ${s.bottom-26} S 25 ${liquidTop+2}, 24 ${liquidTop}"
              stroke="#fff" stroke-width="1" fill="none" opacity=".5" stroke-linecap="round"/>
      </g>
      <!-- glass vessel outline -->
      <path d="${s.body}" fill="hsl(216 20% 92% / .05)" stroke="hsl(216 30% 88% / .55)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- glass highlight -->
      <path d="${s.body.split("M").slice(1,2).map(p=>"M"+p)[0] || s.body}" fill="none"/>
      <rect x="19" y="${s.top+2}" width="2.4" height="${Math.max(8,fh*0.5)}" rx="1.2" fill="#fff" opacity=".35" clip-path="url(#${id}clip)"/>
    </svg>`;
  }

  /* ---- Seed data (believable thought-like content) ---------------------- */
  const DATA = [
    { t:"The bridge idea for the sync layer", c:"If each flask carries its own cTag, I never have to diff the whole vault — just ask Graph what moved since the last delta token. Lightweight by design.", cat:"--cat-blue",   shape:"round",      fill:.8,  d:"2m ago" },
    { t:"Why mornings feel heavier lately", c:"Noticed I open the day reacting instead of choosing. One line before coffee — what matters today — seems to reset it.", cat:"--cat-purple", shape:"erlenmeyer", fill:.6,  d:"Today" },
    { t:"Dad's story about the lighthouse",  c:"He said the keeper never watched the sea — he watched the lamp. The job was to keep the light, not to fear the dark.", cat:"--cat-gold",   shape:"potion",     fill:.95, d:"Yesterday" },
    { t:"Run — 6k, felt effortless",         c:"Negative split without trying. Sleep was 7h40. The two are the same sentence.", cat:"--cat-green",  shape:"vial",       fill:.4,  d:"Yesterday" },
    { t:"A name for the coach mode",          c:"Not 'assistant'. Something that reads the whole pensieve and tells me what I keep circling back to. 'The Mirror'?", cat:"--cat-pink",   shape:"teardrop",   fill:.5,  d:"Mon" },
    { t:"Groceries + the olive oil place",   c:"The small tin from the Tuesday market, lemons, the sourdough starter needs feeding Thursday.", cat:"--cat-orange", shape:"beaker",     fill:.3,  d:"Mon" },
    { t:"Half-dream: the glass library",     c:"Rooms made of vials, each glowing a different colour. I could pour a memory from one shelf into another and it would change colour.", cat:"--cat-purple", shape:"potion",     fill:.7,  d:"Sun" },
    { t:"Quote I don't want to lose",         c:"'We are what we repeatedly do.' Stick it where the morning line lives.", cat:"--cat-yellow", shape:"vial",       fill:.45, d:"Sun" },
    { t:"The phone app is capture, not control", c:"Open, thumb, done. Everything at the bottom. The desktop can be the cathedral; the phone is the doorway.", cat:"--cat-blue",   shape:"round",      fill:.85, d:"Sat" },
    { t:"Idea: flasks should breathe",        c:"A barely-there scale pulse on the focused flask. Alive, not animated. 4s cycle, ease.", cat:"--cat-green",  shape:"erlenmeyer", fill:.55, d:"Sat" },
    { t:"Call Mara back about the trip",     c:"She floated the last week of June. Check if the cabin by the water is still open before replying.", cat:"--cat-red",    shape:"teardrop",   fill:.35, d:"Fri" },
    { t:"What 'extremely fast' really means", c:"Not benchmarks. It means the gap between having a thought and it being safe is near zero. Design for that gap.", cat:"--cat-blue",   shape:"beaker",     fill:.6,  d:"Fri" }
  ];
  // Resolve the gold alias to a hue
  const CAT_HUE = {
    "--cat-blue":"212 70% 68%","--cat-purple":"270 55% 74%","--cat-green":"145 50% 62%",
    "--cat-pink":"330 60% 74%","--cat-orange":"24 85% 68%","--cat-yellow":"45 80% 66%",
    "--cat-red":"0 70% 70%","--cat-gold":"43 92% 55%"
  };

  /* ---- Build the flask stream ------------------------------------------- */
  const stream = $("#stream");
  $("#count").textContent = DATA.length + " memories";

  function buildCard(item, i){
    const el = document.createElement("div");
    el.className = "flask-card";
    el.dataset.index = i;
    el.dataset.text = (item.t + " " + item.c).toLowerCase();
    el.innerHTML = `
      <div class="svg-wrap">${flaskSVG(item.shape, CAT_HUE[item.cat], item.fill)}</div>
      <div class="body">
        <div class="title">${item.t}</div>
        <div class="meta">${item.d}</div>
        <div class="snippet">${item.c}</div>
      </div>`;
    el.addEventListener("click", () => {
      el.scrollIntoView({ behavior: reduceMotion ? "auto":"smooth", block:"start" });
    });
    return el;
  }
  DATA.forEach((item, i) => stream.appendChild(buildCard(item, i)));

  /* ---- Magnify the focused (top-most) card — magnetic snap handled by CSS */
  const cards = [...stream.querySelectorAll(".flask-card")];
  function updateActive(){
    const base = stream.getBoundingClientRect().top + 8;
    let best = null, bestDist = Infinity;
    for (const c of cards){
      if (c.classList.contains("filtered")) continue;
      const d = Math.abs(c.getBoundingClientRect().top - base);
      if (d < bestDist){ bestDist = d; best = c; }
    }
    cards.forEach(c => c.classList.toggle("active", c === best));
  }
  let raf = null;
  stream.addEventListener("scroll", () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { updateActive(); raf = null; });
  }, { passive:true });
  // first paint
  requestAnimationFrame(updateActive);

  /* =========================================================================
     THE WAND — tap conjures the editor; press-and-hold speaks
     ======================================================================= */
  const wand = $("#wand");
  const editor = $("#editor");
  const threadFlash = $("#threadFlash");
  let holdTimer = null, didHold = false;

  function fmtDate(){
    const now = new Date();
    return now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})
         + " · " + now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }

  // A luminous thread shoots from the wand up into the opening editor
  function conjureThread(cb){
    if (reduceMotion){ cb(); return; }
    const r = wand.getBoundingClientRect();
    const screen = $(".screen").getBoundingClientRect();
    const x = r.left + r.width/2 - screen.left;
    const y = r.top + r.height/2 - screen.top;
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width", screen.width);
    svg.setAttribute("height", screen.height);
    svg.style.cssText = "position:absolute;inset:0;";
    svg.innerHTML = `
      <defs><linearGradient id="thr" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="hsl(218 100% 72%)" stop-opacity="0"/>
        <stop offset="60%" stop-color="hsl(215 85% 74%)" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
      </linearGradient></defs>
      <path d="M${x} ${y} C ${x-40} ${y-160}, ${x+40} ${y-320}, ${screen.width/2} 120"
            stroke="url(#thr)" stroke-width="2.5" fill="none" stroke-linecap="round"
            style="stroke-dasharray:600;stroke-dashoffset:600;filter:drop-shadow(0 0 6px hsl(218 100% 72% / .8))"/>`;
    threadFlash.appendChild(svg);
    const path = svg.querySelector("path");
    path.animate([{strokeDashoffset:600},{strokeDashoffset:0}],{duration:420,easing:"cubic-bezier(.22,1,.36,1)"});
    path.animate([{opacity:1},{opacity:1,offset:.6},{opacity:0}],{duration:620,easing:"ease-out"})
        .onfinish = () => { svg.remove(); };
    setTimeout(cb, 180);
  }

  function openEditor(){
    $("#editorTitle").textContent = "";
    $("#editorBody").innerHTML = "";
    $("#editorDate").textContent = fmtDate();
    conjureThread(() => {
      editor.classList.add("open");
      setTimeout(() => $("#editorTitle").focus(), 420);
    });
    haptic(10);
  }

  // tap = conjure; hold = speak
  wand.addEventListener("pointerdown", () => {
    didHold = false;
    holdTimer = setTimeout(() => {
      didHold = true;
      haptic(16);
      wand.classList.add("holding");
      openEditor();
      // start dictation in the editor after it opens
      setTimeout(() => startEditorDictation(), 520);
    }, 420);
  });
  const endHold = () => {
    clearTimeout(holdTimer);
    wand.classList.remove("holding");
    if (!didHold) openEditor();  // a tap
  };
  wand.addEventListener("pointerup", endHold);
  wand.addEventListener("pointerleave", () => { clearTimeout(holdTimer); wand.classList.remove("holding"); });

  $("#editorClose").addEventListener("click", () => editor.classList.remove("open"));
  $("#editorDone").addEventListener("click", saveNote);

  /* ---- Save → "poured into a flask" ------------------------------------- */
  const toast = $("#toast");
  function saveNote(){
    const title = ($("#editorTitle").textContent || "").trim() || "Untitled thought";
    const text  = ($("#editorBody").textContent || "").trim();
    const fill  = Math.min(1, Math.max(.18, text.length / 220));
    const cats  = Object.keys(CAT_HUE);
    const cat   = cats[Math.floor(Math.random()*cats.length)];
    const shape = SHAPES[Math.floor(Math.random()*SHAPES.length)];

    // add to the data + top of the stream
    const item = { t:title, c:text || "…", cat, shape, fill, d:"Just now" };
    DATA.unshift(item);
    const card = buildCard(item, 0);
    stream.insertBefore(card, stream.firstChild);
    cards.unshift(card);
    $("#count").textContent = DATA.length + " memories";

    // confirmation flask in the toast
    $("#toastFlask").innerHTML = flaskSVG(shape, CAT_HUE[cat], fill);
    $("#toastSub").textContent = "Saved locally · indexed";
    editor.classList.remove("open");
    haptic(12);
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);

    // scroll the new flask to the top (it becomes the magnified one)
    setTimeout(() => { stream.scrollTo({top:0, behavior: reduceMotion?"auto":"smooth"}); updateActive(); }, 120);
  }

  /* =========================================================================
     ACCIO — summon bar, autofocus, live-filtering flasks
     ======================================================================= */
  const accioOverlay = $("#accioOverlay");
  const accioInput = $("#accioInput");
  const accioResults = $("#accioResults");

  function openAccio(){
    accioOverlay.classList.add("open");
    renderAccio("");
    haptic(8);
    setTimeout(() => accioInput.focus(), 120);  // immediately ready to type
  }
  function closeAccio(){
    accioOverlay.classList.remove("open");
    accioInput.value = "";
    accioInput.blur();
  }
  $("#accioPill").addEventListener("click", openAccio);
  accioOverlay.addEventListener("click", (e) => { if (e.target === accioOverlay) closeAccio(); });

  function highlight(text, q){
    if (!q) return text;
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return text;
    return text.slice(0,i) + "<mark>" + text.slice(i,i+q.length) + "</mark>" + text.slice(i+q.length);
  }

  function renderAccio(q){
    q = q.trim();
    const matches = DATA.map((d,i)=>({d,i}))
      .filter(({d}) => !q || (d.t + " " + d.c).toLowerCase().includes(q.toLowerCase()));
    accioResults.innerHTML = "";
    if (!matches.length){
      accioResults.innerHTML = `<div class="accio-empty">No flask holds “${q}” — yet.</div>`;
      return;
    }
    // show newest-first, nearest the bar
    matches.slice(0, 7).forEach(({d}, idx) => {
      const row = document.createElement("div");
      row.className = "accio-hit";
      row.style.animationDelay = (idx*35) + "ms";
      row.innerHTML = `
        <div class="svg-wrap">${flaskSVG(d.shape, CAT_HUE[d.cat], d.fill)}</div>
        <div><div class="title">${highlight(d.t, q)}</div><div class="meta">${d.d}</div></div>`;
      row.addEventListener("click", () => {
        closeAccio();
        const card = cards.find(c => c.querySelector(".title").textContent === d.t);
        if (card) setTimeout(()=>card.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"}),80);
      });
      accioResults.appendChild(row);
    });
  }
  accioInput.addEventListener("input", () => {
    renderAccio(accioInput.value);
    // also narrow the live reel underneath (flasks narrowing live)
    const q = accioInput.value.trim().toLowerCase();
    cards.forEach(c => c.classList.toggle("filtered", !!q && !c.dataset.text.includes(q)));
  });
  accioInput.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAccio(); });

  /* =========================================================================
     SPEECH — simulate dictation (listening state + sample text drop-in)
     ======================================================================= */
  const SAMPLE_CAPTURE = "I keep coming back to the idea that the phone shouldn't make me think. It should just catch the thought before it escapes.";
  const SAMPLE_SEARCHES = ["lighthouse","morning line","sync layer","the trip"];

  function typeInto(target, text, isEl, done){
    if (reduceMotion){
      if (isEl) target.textContent = text; else target.value = text;
      done && done(); return;
    }
    let i = 0;
    const tick = () => {
      i += Math.max(1, Math.round(Math.random()*2));
      const slice = text.slice(0, i);
      if (isEl) target.textContent = slice; else { target.value = slice; target.dispatchEvent(new Event("input")); }
      if (i < text.length) setTimeout(tick, 26);
      else done && done();
    };
    tick();
  }

  // editor dictation
  const editorMic = $("#editorMic");
  let dictating = false;
  function startEditorDictation(){
    if (dictating) return;
    dictating = true;
    editorMic.classList.add("listening");
    $("#editorTitle").textContent = $("#editorTitle").textContent || "A thought, spoken";
    const body = $("#editorBody");
    body.focus();
    setTimeout(() => {
      typeInto(body, SAMPLE_CAPTURE, true, () => {
        editorMic.classList.remove("listening");
        dictating = false;
      });
    }, 700);
  }
  editorMic.addEventListener("click", () => {
    if (dictating){ editorMic.classList.remove("listening"); dictating = false; }
    else startEditorDictation();
  });

  // search dictation
  const accioMic = $("#accioMic");
  let listeningSearch = false;
  accioMic.addEventListener("click", () => {
    if (listeningSearch) return;
    listeningSearch = true;
    accioMic.classList.add("listening");
    accioInput.value = "";
    const phrase = SAMPLE_SEARCHES[Math.floor(Math.random()*SAMPLE_SEARCHES.length)];
    setTimeout(() => {
      typeInto(accioInput, phrase, false, () => {
        accioMic.classList.remove("listening");
        listeningSearch = false;
      });
    }, 650);
  });

  /* =========================================================================
     SYNC SPELL — shimmer + rune + ripple, then a settled "done" state
     ======================================================================= */
  const syncBtn = $("#syncBtn");
  const syncSpell = $("#syncSpell");
  const syncRune = $("#syncRune");
  const syncRipple = $("#syncRipple");
  const syncLabel = $("#syncLabel");
  let syncing = false;
  syncBtn.addEventListener("click", () => {
    if (syncing) return;
    syncing = true;
    haptic(14);
    syncBtn.classList.add("syncing");
    syncSpell.classList.add("show");
    syncLabel.textContent = "Weaving to the cloud…";
    // retrigger CSS animations
    syncRune.classList.remove("go"); syncRipple.classList.remove("go");
    void syncRune.offsetWidth; void syncRipple.offsetWidth;
    syncRune.classList.add("go"); syncRipple.classList.add("go");
    setTimeout(() => {
      syncLabel.textContent = "All memories safe · just now";
      syncLabel.style.color = "hsl(145 50% 62%)";
    }, 1400);
    setTimeout(() => {
      syncSpell.classList.remove("show");
      syncBtn.classList.remove("syncing");
      syncLabel.style.color = "";
      syncing = false;
    }, 2400);
  });

  /* ---- Prevent elastic page scroll on real phones ----------------------- */
  document.addEventListener("touchmove", (e) => {
    // allow scrolling inside scroll regions only
    if (!e.target.closest(".stream, .accio-results, .editor-surface")) e.preventDefault();
  }, { passive:false });

})();
</script>
</body>
</html>
