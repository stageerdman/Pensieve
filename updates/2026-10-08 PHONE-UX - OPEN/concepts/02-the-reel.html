<!--
  Pensieve · Phone concept 02 — "The Reel"
  A recall-forward home: memories are magical glass flasks drifting on a current.
  The center flask is always magnified (title + a slice of content + glowing vessel);
  neighbours shrink to title + date. Momentum scroll with magnetic snap.
  Accio summons a search bar from the top that re-filters the SAME reel live.
  The wand (capture) is always one tap away; sync is cast as a spell.

  One file. Inline CSS + vanilla JS. No external resources. SVG drawn inline.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#121722" />
<title>Pensieve — The Reel</title>

<style>
/* ============================================================= TOKENS */
:root{
  /* Basin (dark) — exact Pensieve channels */
  --surface:        222 24% 11%;
  --surface-sunken: 222 22% 13%;
  --surface-raised: 222 18% 17%;
  --text:           216 18% 84%;
  --text-muted:     218 12% 60%;
  --border:         222 16% 21%;
  --accent:         215 85% 74%;
  --accent-glow:    218 100% 72%;
  --gold:           43 92% 55%;

  /* category hues (liquid foreground) */
  --h-blue:   212 70% 68%;
  --h-purple: 270 55% 74%;
  --h-green:  145 50% 62%;
  --h-pink:   330 60% 74%;
  --h-orange: 24 85% 68%;
  --h-yellow: 45 80% 66%;
  --h-red:    0 70% 70%;

  --font: -apple-system, "SF Pro Text", "SF Pro", system-ui, sans-serif;
  --r: 14px;

  --dock-h: 120px;   /* bottom thumb dock incl. safe area */
  --status-h: 54px;  /* status bar */

  /* spring-ish easings */
  --spring: cubic-bezier(.22,1,.36,1);
  --swift:  cubic-bezier(.4,0,.2,1);
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:var(--font);
  background:
    radial-gradient(130% 90% at 50% -10%, #1a2436 0%, #0c0f16 55%, #070a0f 100%);
  color:hsl(var(--text));
  display:flex; align-items:center; justify-content:center;
  min-height:100dvh; padding:28px; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================= PHONE FRAME */
.phone{
  position:relative;
  width:390px; height:844px;
  border-radius:52px;
  background:hsl(var(--surface));
  overflow:hidden;
  box-shadow:
    0 0 0 12px #0a0d13,
    0 0 0 13px #2a3140,
    0 50px 120px -30px rgba(0,0,0,.9),
    0 0 90px -20px rgba(70,120,220,.25);
  isolation:isolate;
}
/* Basin floor — a deep stone glow that the flasks float above */
.phone::before{
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 8%, hsl(220 40% 18% / .7), transparent 60%),
    radial-gradient(90% 55% at 50% 108%, hsl(218 70% 20% / .5), transparent 70%);
}

/* On a real iPhone opened full-screen: fill the device, drop the frame */
@media (max-width:440px){
  body{ padding:0; }
  .phone{
    width:100vw; height:100dvh; border-radius:0; box-shadow:none;
  }
}

/* ============================================================= STATUS BAR */
.status{
  position:absolute; top:0; left:0; right:0; z-index:40;
  height:calc(var(--status-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 30px 0;
  display:flex; align-items:center; justify-content:space-between;
  font-size:15px; font-weight:600; letter-spacing:.2px;
  color:hsl(var(--text));
  pointer-events:none;
}
.status .right{ display:flex; align-items:center; gap:7px; }
.status svg{ display:block; }

/* ============================================================= REEL */
.reel-wrap{
  position:absolute; left:0; right:0;
  top:calc(var(--status-h) + env(safe-area-inset-top));
  bottom:calc(var(--dock-h) + env(safe-area-inset-bottom));
  z-index:10;
}
/* a soft focal spotlight band — subliminal "this is where the memory is held" */
.focal-glow{
  position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
  width:360px; height:300px; z-index:1; pointer-events:none;
  background:radial-gradient(60% 50% at 50% 50%, hsl(var(--accent) / .10), transparent 70%);
  opacity:.9;
}
.reel{
  position:relative; z-index:2;
  height:100%; overflow-y:scroll; overflow-x:hidden;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  /* top/bottom pad so the first & last flasks can reach the focal centre */
  padding:46% 26px;
}
.reel::-webkit-scrollbar{ display:none; }

/* ---- a single memory in the reel ---- */
.card{
  scroll-snap-align:center;
  scroll-snap-stop:always;
  display:flex; align-items:center; justify-content:center;
  min-height:150px;            /* stable slot → clean magnetic snap */
  will-change:transform;
}
.card.collapsed{               /* filtered out by Accio — reel narrows */
  min-height:0; height:0; margin:0; opacity:0;
  transform:scale(.4);
  scroll-snap-align:none;
  pointer-events:none;
  transition:height .4s var(--spring), opacity .3s var(--swift), transform .4s var(--spring);
  overflow:hidden;
}
.card:not(.collapsed){
  transition:height .4s var(--spring);
}

.inner{
  position:relative;
  display:flex; align-items:center; gap:16px;
  width:100%;
  padding:14px 16px;
  border-radius:var(--r);
  /* scale/opacity are driven by JS (distance from focus) via --k */
  transform:scale(var(--s,1)) translateX(var(--tx,0));
  opacity:var(--o,1);
  will-change:transform,opacity;
  transition:background .35s var(--swift), box-shadow .4s var(--spring), border-color .35s;
  border:1px solid transparent;
}
/* focused card gets a faint raised glass panel */
.card.focused .inner{
  background:linear-gradient(180deg, hsl(var(--surface-raised) / .55), hsl(var(--surface-sunken) / .35));
  border-color:hsl(var(--border) / .8);
  box-shadow:0 20px 50px -24px rgba(0,0,0,.8), inset 0 1px 0 hsl(220 40% 40% / .18);
}

/* --- flask vessel --- */
.vessel{
  position:relative;
  flex:0 0 auto;
  width:78px; height:104px;
  display:flex; align-items:center; justify-content:center;
}
.vessel .glow{
  position:absolute; left:50%; top:58%;
  width:150%; height:150%;
  transform:translate(-50%,-50%) translateY(var(--pg,0));   /* parallax */
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, hsl(var(--hue) / .55), hsl(var(--hue) / 0) 68%);
  filter:blur(7px);
  opacity:var(--go,.35);
  z-index:0; pointer-events:none;
  transition:opacity .35s var(--swift);
}
.card.focused .vessel .glow{ animation:breathe 5.5s var(--swift) infinite; }
.vessel svg{ position:relative; z-index:1; width:100%; height:100%; overflow:visible; }

/* --- text --- */
.meta{ min-width:0; flex:1; }
.title{
  font-size:17px; font-weight:600; line-height:1.25;
  color:hsl(var(--text));
  letter-spacing:-.01em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.sub{ position:relative; margin-top:7px; min-height:2.9em; }
.date, .snippet{
  position:absolute; inset:0;
  transition:opacity .4s var(--swift);
}
.date{
  font-size:13px; color:hsl(var(--text-muted)); opacity:1;
  display:flex; align-items:flex-start; gap:7px;
}
.date .dot{ width:7px; height:7px; border-radius:50%; background:hsl(var(--hue)); margin-top:4px; box-shadow:0 0 8px hsl(var(--hue) / .7); flex:0 0 auto; }
.snippet{
  font-size:14px; line-height:1.45; color:hsl(var(--text-muted));
  opacity:0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card.focused .date{ opacity:0; }
.card.focused .snippet{ opacity:1; }

/* ============================================================= SUMMON (Accio search) */
.summon{
  position:absolute; z-index:45; left:0; right:0;
  top:0;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 16px;
  background:linear-gradient(180deg, hsl(var(--surface) / .96) 55%, hsl(var(--surface) / 0));
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  transform:translateY(-115%);
  transition:transform .5s var(--spring);
}
.summon.open{ transform:translateY(0); }
.summon-bar{
  display:flex; align-items:center; gap:10px;
  height:50px; padding:0 8px 0 16px;
  border-radius:16px;
  background:hsl(var(--surface-sunken));
  border:1px solid hsl(var(--border));
  box-shadow:0 0 0 0 hsl(var(--accent) / 0);
  transition:box-shadow .4s, border-color .4s;
}
.summon.open .summon-bar{
  border-color:hsl(var(--accent) / .55);
  box-shadow:0 10px 40px -16px hsl(var(--accent-glow) / .6);
}
.summon-bar .ac-ico{ color:hsl(var(--accent)); flex:0 0 auto; }
.summon-bar input{
  flex:1; min-width:0; background:none; border:none; outline:none;
  color:hsl(var(--text)); font-family:var(--font); font-size:16px; letter-spacing:-.01em;
}
.summon-bar input::placeholder{ color:hsl(var(--text-muted)); }
.summon-mic, .summon-close{
  flex:0 0 auto; width:38px; height:38px; border:none; border-radius:11px;
  background:hsl(var(--surface-raised)); color:hsl(var(--text-muted));
  display:flex; align-items:center; justify-content:center;
}
.summon-mic.live{ color:hsl(var(--accent)); animation:pulse 1.1s var(--swift) infinite; }
.summon .hint{
  margin:10px 6px 0; font-size:12.5px; color:hsl(var(--text-muted)); opacity:.85;
}
.summon .count{ color:hsl(var(--accent)); font-weight:600; }

/* ============================================================= THUMB DOCK */
.dock{
  position:absolute; z-index:42; left:0; right:0; bottom:0;
  height:calc(var(--dock-h) + env(safe-area-inset-bottom));
  padding:0 34px calc(env(safe-area-inset-bottom) + 20px);
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(0deg, hsl(var(--surface)) 42%, hsl(var(--surface) / 0));
  pointer-events:none;
}
.dock > *{ pointer-events:auto; }

.sat{                       /* satellite buttons: sync + wand */
  width:54px; height:54px; border-radius:50%;
  border:1px solid hsl(var(--border));
  background:hsl(var(--surface-raised) / .85);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center;
  color:hsl(var(--text)); position:relative;
  transition:transform .3s var(--spring), box-shadow .3s;
}
.sat:active{ transform:scale(.9); }
.sat.sync{ color:hsl(var(--accent)); }
.sat.sync.casting{ animation:spin 1.4s linear infinite; }
.sat.wand{
  color:hsl(var(--gold));
  border-color:hsl(var(--gold) / .45);
  box-shadow:0 0 0 1px hsl(var(--gold) / .25), 0 14px 34px -14px hsl(var(--gold) / .55), inset 0 1px 0 hsl(var(--gold) / .3);
  background:radial-gradient(120% 120% at 50% 20%, hsl(43 70% 24% / .8), hsl(var(--surface-raised) / .9));
}

/* Accio — the big thumb button at centre */
.accio{
  width:76px; height:76px; border-radius:50%;
  border:none; position:relative;
  background:radial-gradient(130% 130% at 50% 18%, hsl(var(--accent)) 0%, hsl(215 80% 56%) 60%, hsl(220 75% 44%) 100%);
  box-shadow:
    0 0 0 6px hsl(var(--accent) / .10),
    0 18px 40px -14px hsl(var(--accent-glow) / .8),
    inset 0 2px 0 hsl(210 100% 90% / .55);
  color:#081018;
  display:flex; align-items:center; justify-content:center;
  transform:translateY(-14px);
  transition:transform .3s var(--spring);
}
.accio:active{ transform:translateY(-14px) scale(.92); }
.accio .ring{
  position:absolute; inset:-6px; border-radius:50%;
  border:1px solid hsl(var(--accent) / .4);
  opacity:0;
}
.accio.summoning .ring{ animation:ripple .6s var(--swift); }

/* ============================================================= EDITOR (capture) */
.editor{
  position:absolute; inset:0; z-index:60;
  background:hsl(var(--surface));
  display:flex; flex-direction:column;
  transform:translateY(100%);
  transition:transform .52s var(--spring);
}
.editor.open{ transform:translateY(0); }
.editor-top{
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;
}
.ed-btn{
  border:none; background:none; font-family:var(--font); font-size:16px;
  color:hsl(var(--accent)); display:flex; align-items:center; gap:4px;
}
.ed-pour{
  font-weight:600; color:hsl(var(--gold));
  padding:8px 16px; border-radius:12px;
  background:hsl(43 70% 20% / .5); border:1px solid hsl(var(--gold) / .4);
}
.ed-body{ flex:1; overflow-y:auto; padding:18px 24px 24px; }
.ed-title{
  font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.2;
  color:hsl(var(--text)); outline:none; margin-bottom:14px;
}
.ed-text{
  font-size:17px; line-height:1.6; color:hsl(var(--text)); outline:none;
  min-height:300px; caret-color:hsl(var(--accent));
}
.ph:empty::before{ content:attr(data-ph); color:hsl(var(--text-muted)); pointer-events:none; }
/* faux keyboard accessory — the keyboard is "implied" */
.ed-acc{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px calc(env(safe-area-inset-bottom) + 14px);
  border-top:1px solid hsl(var(--border));
  background:hsl(var(--surface-sunken));
}
.ed-acc .threadline{ font-size:13px; color:hsl(var(--text-muted)); display:flex; align-items:center; gap:8px; }
.ed-mic{
  width:46px; height:46px; border-radius:14px; border:1px solid hsl(var(--border));
  background:hsl(var(--surface-raised)); color:hsl(var(--text));
  display:flex; align-items:center; justify-content:center;
}
.ed-mic.live{ color:hsl(var(--accent)); border-color:hsl(var(--accent) / .5); animation:pulse 1.1s var(--swift) infinite; }

/* the "pour into a flask" moment */
.pour-stage{
  position:absolute; inset:0; z-index:70; display:none;
  align-items:center; justify-content:center;
  background:radial-gradient(60% 50% at 50% 42%, hsl(var(--surface-sunken) / .9), hsl(var(--surface) / .96));
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.pour-stage.show{ display:flex; }
.pour-flask{ width:150px; height:200px; }
.pour-word{
  position:absolute; bottom:24%; width:100%; text-align:center;
  color:hsl(var(--text)); font-size:16px; letter-spacing:.2px; opacity:0;
}
.pour-stage.show .pour-word{ animation:fadeUp .6s var(--spring) .55s both; }

/* ============================================================= TOAST */
.toast{
  position:absolute; z-index:80; left:50%; bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 14px);
  transform:translate(-50%,16px); opacity:0;
  background:hsl(var(--surface-raised) / .96);
  border:1px solid hsl(var(--border));
  color:hsl(var(--text)); font-size:14px; font-weight:500;
  padding:11px 18px; border-radius:14px; white-space:nowrap;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.8);
  display:flex; align-items:center; gap:9px;
  pointer-events:none; transition:transform .45s var(--spring), opacity .35s;
}
.toast.show{ transform:translate(-50%,0); opacity:1; }
.toast.gold{ border-color:hsl(var(--gold) / .5); }
.toast .tdot{ width:8px; height:8px; border-radius:50%; background:hsl(var(--gold)); box-shadow:0 0 10px hsl(var(--gold)); }

/* ============================================================= SYNC SPELL */
.spell{
  position:absolute; inset:0; z-index:75; display:none;
  align-items:center; justify-content:center; pointer-events:none;
}
.spell.cast{ display:flex; }
.spell .rune{
  position:absolute; width:260px; height:260px; border-radius:50%;
  border:1px dashed hsl(var(--accent) / .55);
  animation:spin 3s linear infinite;
}
.spell .rune.r2{ width:190px; height:190px; border-style:solid; border-color:hsl(var(--gold) / .45); animation-direction:reverse; animation-duration:4s; }
.spell .wave{
  position:absolute; width:40px; height:40px; border-radius:50%;
  border:2px solid hsl(var(--accent) / .7);
  animation:wave 1.6s var(--swift) infinite;
}
.spell .wave.w2{ animation-delay:.5s; }
.spell .wave.w3{ animation-delay:1s; }

/* ============================================================= HOME INDICATOR */
.home-ind{
  position:absolute; z-index:90; left:50%; bottom:9px; transform:translateX(-50%);
  width:134px; height:5px; border-radius:3px; background:hsl(var(--text) / .4);
  pointer-events:none;
}

/* ============================================================= KEYFRAMES */
@keyframes breathe{ 0%,100%{ transform:translate(-50%,-50%) translateY(var(--pg,0)) scale(1); opacity:var(--go,.5);} 50%{ transform:translate(-50%,-50%) translateY(var(--pg,0)) scale(1.08); opacity:calc(var(--go,.5) + .18);} }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 hsl(var(--accent) / .5);} 50%{ box-shadow:0 0 0 7px hsl(var(--accent) / 0);} }
@keyframes spin{ to{ transform:rotate(360deg);} }
@keyframes ripple{ 0%{ opacity:.9; transform:scale(.8);} 100%{ opacity:0; transform:scale(1.5);} }
@keyframes wave{ 0%{ transform:scale(.4); opacity:.9;} 100%{ transform:scale(4.2); opacity:0;} }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
@keyframes thread{ 0%,100%{ opacity:.14; transform:translateY(2px);} 50%{ opacity:.42; transform:translateY(-2px);} }
.card.focused .thread{ animation:thread 5s ease-in-out infinite; }
.thread{ opacity:.16; transform-box:fill-box; transform-origin:bottom; }

@keyframes pourFill{ from{ transform:translateY(0);} to{ transform:translateY(-96px);} }

/* ============================================================= REDUCED MOTION */
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  .inner, .summon, .editor, .card, .toast, .accio{ transition-duration:.12s !important; }
  .card.focused .vessel .glow, .card.focused .thread{ animation:none; }
}
</style>


<div class="phone" id="phone">

  <!-- ░░ STATUS BAR ░░ -->
  <div class="status">
    <span>9:41</span>
    <div class="right">
      <!-- signal -->
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <!-- wifi -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2C5.4 2 2.6 3.2.6 5.2L2 6.6C3.7 4.9 6 3.9 8.5 3.9s4.8 1 6.5 2.7l1.4-1.4C14.4 3.2 11.6 2 8.5 2zm0 3.6c-1.8 0-3.5.7-4.7 1.9l1.4 1.4c.9-.9 2-1.4 3.3-1.4s2.4.5 3.3 1.4l1.4-1.4C12 6.3 10.3 5.6 8.5 5.6zm0 3.5L7 10.6c.4.4 1 .4 1.4 0z"/></svg>

      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="18" height="7" rx="1.6" fill="currentColor"/><rect x="23.5" y="4" width="1.8" height="4" rx="1" fill="currentColor" fill-opacity=".5"/></svg>
    </div>
  </div>

  <!-- ░░ THE REEL (home) ░░ -->
  <div class="reel-wrap">
    <div class="focal-glow"></div>
    <div class="reel" id="reel"></div>
  </div>

  <!-- ░░ SUMMON BAR (Accio search, slides from top) ░░ -->
  <div class="summon" id="summon">
    <div class="summon-bar">
      <span class="ac-ico">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </span>
      <input id="summon-input" type="text" placeholder="Summon a memory…" autocomplete="off" autocorrect="off" spellcheck="false" />
      <button class="summon-mic" id="summon-mic" aria-label="Speak to search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="summon-close" id="summon-close" aria-label="Close search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="hint" id="summon-hint">Speak or type — the reel narrows as you go.</div>
  </div>

  <!-- ░░ THUMB DOCK ░░ -->
  <div class="dock">
    <!-- sync spell -->
    <button class="sat sync" id="sync-btn" aria-label="Sync memories">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
    </button>

    <!-- Accio -->
    <button class="accio" id="accio" aria-label="Accio — summon search">
      <span class="ring"></span>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.6-4.6"/></svg>
    </button>

    <!-- wand (capture) -->
    <button class="sat wand" id="wand" aria-label="Capture a new thought">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6L6 15l-2.5 5.5L9 18l9-9z"/><path d="M18 3l.9 2.1L21 6l-2.1.9L18 9l-.9-2.1L15 6l2.1-.9z"/></svg>
    </button>
  </div>

  <!-- ░░ EDITOR (capture) ░░ -->
  <div class="editor" id="editor">
    <div class="editor-top">
      <button class="ed-btn" id="ed-cancel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Basin
      </button>
      <button class="ed-pour" id="ed-pour">Pour</button>
    </div>
    <div class="ed-body">
      <div class="ed-title ph" id="ed-title" contenteditable="true" data-ph="Title"></div>
      <div class="ed-text ph" id="ed-text" contenteditable="true" data-ph="Start writing… the thread is open."></div>
    </div>
    <div class="ed-acc">
      <span class="threadline">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="hsl(43 92% 55%)" stroke-width="2" stroke-linecap="round"><path d="M12 3v18"/><path d="M12 3c0 4 4 4 4 8s-4 4-4 8"/></svg>
        thread open
      </span>
      <button class="ed-mic" id="ed-mic" aria-label="Dictate">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- pour-into-a-flask moment -->
    <div class="pour-stage" id="pour-stage">
      <div class="pour-flask" id="pour-flask"></div>
      <div class="pour-word">Poured into a flask</div>
    </div>
  </div>

  <!-- ░░ SYNC SPELL overlay ░░ -->
  <div class="spell" id="spell">
    <div class="rune"></div>
    <div class="rune r2"></div>
    <div class="wave"></div>
    <div class="wave w2"></div>
    <div class="wave w3"></div>
  </div>

  <!-- ░░ TOAST ░░ -->
  <div class="toast" id="toast"><span class="tdot"></span><span id="toast-msg"></span></div>

  <div class="home-ind"></div>
</div>


<script>
/* =====================================================================
   1 · SEED DATA — believable thoughts, varied hue / shape / fill
   ===================================================================== */
const SHAPES = ['round','erlen','vial','potion','teardrop','beaker'];

const MEMORIES = [
  { t:"The quiet hour before anyone wakes",   s:"5:40am again. The house holds its breath and my head is finally a clear room. This is when the real work gets decided.", d:"Today",        hue:'--h-blue',   shape:'round',    fill:.82 },
  { t:"Why I keep circling the same fear",     s:"It isn't the work I'm avoiding — it's being seen doing it badly first. Naming that already loosened its grip.",            d:"Yesterday",    hue:'--h-purple', shape:'potion',   fill:.64 },
  { t:"Dad's hands fixing the old radio",      s:"The solder smell, the little curses under his breath, the way he'd pause and listen for the hiss to clear.",             d:"2 days ago",   hue:'--h-orange', shape:'teardrop', fill:.5  },
  { t:"Idea: a clock that keeps tide-time",    s:"Not hours — tides. A face that breathes in and out twice a day. For people who live near water and want to feel it.",  d:"3 days ago",   hue:'--h-green',  shape:'erlen',    fill:.38 },
  { t:"What courage actually felt like today", s:"Smaller than I expected. Just saying the true sentence in the meeting and letting the silence sit there afterwards.",      d:"Mon",          hue:'--h-red',    shape:'vial',     fill:.46 },
  { t:"A line I never want to lose",           s:"“The cure for anything is salt water — sweat, tears, or the sea.” Keep it where I can find it on grey days.",   d:"Sun",          hue:'--h-yellow', shape:'potion',   fill:.3  },
  { t:"Rain on the skylight, 2am",             s:"Couldn't sleep, didn't mind. Watched the drops race and lost an hour feeling eight years old again.",                     d:"Sat",          hue:'--h-blue',   shape:'round',    fill:.58 },
  { t:"What she said at the station",          s:"“You don't have to carry the whole thing — just the next part.” I think she was right and I think she knew it.", d:"Last week",    hue:'--h-pink',   shape:'teardrop', fill:.7  },
  { t:"Draft: a letter I won't send",          s:"Started it angry, ended it grateful. Funny how writing to someone is really writing to yourself about them.",            d:"Last week",    hue:'--h-purple', shape:'vial',     fill:.44 },
  { t:"Mile 7 clarity",                        s:"The legs went quiet and the plan for Q2 arranged itself without me asking. Run first, decide second — note that.",       d:"Oct 1",        hue:'--h-green',  shape:'beaker',   fill:.52 },
  { t:"Fear is a compass, not a wall",         s:"Every direction I'm scared to look is pointing at something I actually want. Follow the fear, gently.",                   d:"Sep 28",       hue:'--h-red',    shape:'erlen',    fill:.6  },
  { t:"The smell of the old library",          s:"Dust, warm paper, floor wax. One breath and I'm sixteen with a stack too heavy to carry and nowhere to be.",            d:"Sep 24",       hue:'--h-orange', shape:'round',    fill:.72 },
  { t:"Small win: inbox at zero",              s:"Not important, but it felt like clearing fog off a windscreen. Momentum is mostly just tidying.",                        d:"Sep 22",       hue:'--h-yellow', shape:'beaker',   fill:.34 },
  { t:"A question worth living inside",        s:"What would this look like if it were easy? Keep asking it until the knot in the plan comes undone.",                     d:"Sep 20",       hue:'--h-pink',   shape:'teardrop', fill:.48 },
];

/* =====================================================================
   2 · FLASK SVG — six glass silhouettes, coloured liquid, glow,
       glass glint, and a faint rising "memory thread"
   ===================================================================== */
const BODIES = {
  round:    "M44,16 L44,66 C30,70 22,84 22,98 C22,116 36,128 50,128 C64,128 78,116 78,98 C78,84 70,70 56,66 L56,16 Z",
  erlen:    "M38,18 L38,52 L22,118 C21,125 25,130 32,130 L68,130 C75,130 79,125 78,118 L62,52 L62,18 Z",
  vial:     "M39,14 L61,14 L61,116 C61,125 56,131 50,131 C44,131 39,125 39,116 Z",
  potion:   "M42,12 L58,12 L58,20 L56,40 C70,46 76,62 76,82 C76,110 64,128 50,128 C36,128 24,110 24,82 C24,62 30,46 44,40 L42,20 Z",
  teardrop: "M50,12 C54,40 80,70 80,98 C80,118 67,130 50,130 C33,130 20,118 20,98 C20,70 46,40 50,12 Z",
  beaker:   "M30,22 L30,116 C30,125 35,130 44,130 L56,130 C65,130 70,125 70,116 L70,22 L66,22 L64,18 L70,16 L70,20 Z"
};

let _uid = 0;
function flaskSVG(shape, hueVar, fill){
  const id = 'f' + (_uid++);
  const body = BODIES[shape] || BODIES.round;
  // liquid top (y) — clamp so even low-fill shows a drink of colour
  const f = Math.max(.12, Math.min(.95, fill));
  const liqTop = 134 - f * 118;
  const hue = `var(${hueVar})`;
  return `
  <svg viewBox="0 0 100 146" aria-hidden="true">
    <defs>
      <linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"  stop-color="hsl(${hue} / .95)"/>
        <stop offset="1"  stop-color="hsl(${hue})" stop-opacity=".82"/>
      </linearGradient>
      <linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="hsl(220 30% 80% / .5)"/>
        <stop offset=".5" stop-color="hsl(220 20% 60% / .12)"/>
        <stop offset="1" stop-color="hsl(220 20% 50% / .28)"/>
      </linearGradient>
      <clipPath id="${id}c"><path d="${body}"/></clipPath>
    </defs>

    <!-- glass body fill (faint) -->
    <path d="${body}" fill="hsl(220 30% 70% / .05)"/>

    <!-- liquid + meniscus + memory thread, all clipped to the vessel -->
    <g clip-path="url(#${id}c)">
      <rect x="0" y="${liqTop}" width="100" height="146" fill="url(#${id}l)"/>
      <rect x="0" y="${liqTop}" width="100" height="3" fill="hsl(${hue} / .9)" opacity=".7"/>
      <path class="thread" d="M50,130 C60,112 40,96 50,78 C60,60 42,44 50,26"
            fill="none" stroke="hsl(210 100% 95% / .8)" stroke-width="1.6" stroke-linecap="round"/>
      <!-- inner left sheen on the liquid -->
      <path d="M30,${liqTop+4} C26,100 30,120 36,130" fill="none" stroke="hsl(210 100% 95% / .18)" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- glass rim + outline -->
    <path d="${body}" fill="none" stroke="url(#${id}g)" stroke-width="2.4"/>
    <!-- bright glint, upper-left -->
    <path d="${glint(shape)}" fill="none" stroke="hsl(210 100% 97% / .6)" stroke-width="2.4" stroke-linecap="round"/>
  </svg>`;
}
// a short highlight stroke per silhouette
function glint(shape){
  switch(shape){
    case 'erlen':    return "M43,26 L31,96";
    case 'vial':     return "M44,22 L44,108";
    case 'potion':   return "M38,52 C32,64 32,82 36,98";
    case 'teardrop': return "M42,44 C34,64 32,84 36,104";
    case 'beaker':   return "M36,30 L36,112";
    default:         return "M40,24 C30,60 30,92 38,114"; // round
  }
}

/* =====================================================================
   3 · BUILD THE REEL
   ===================================================================== */
const reel = document.getElementById('reel');

function cardHTML(m){
  return `
    <div class="card" data-text="${(m.t + ' ' + m.s).toLowerCase().replace(/"/g,'')}">
      <div class="inner" style="--hue:var(${m.hue})">
        <div class="vessel">
          <div class="glow" style="--hue:var(${m.hue})"></div>
          ${flaskSVG(m.shape, m.hue, m.fill)}
        </div>
        <div class="meta">
          <div class="title">${escapeHTML(m.t)}</div>
          <div class="sub">
            <div class="date"><span class="dot"></span><span>${escapeHTML(m.d)}</span></div>
            <div class="snippet">${escapeHTML(m.s)}</div>
          </div>
        </div>
      </div>
    </div>`;
}
function escapeHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderReel(list){
  reel.innerHTML = list.map(cardHTML).join('');
  cards = Array.from(reel.querySelectorAll('.card'));
  // tapping the focused flask re-opens it (recall → read / continue)
  cards.forEach(c => c.addEventListener('click', () => {
    if (c.classList.contains('focused')) openFromCard(c);
    else centerOn(c);
  }));
  updateReel();
}

/* =====================================================================
   4 · REEL PHYSICS — distance-from-focus scale / opacity / parallax,
       magnetic snap handled by CSS scroll-snap; this paints the falloff
   ===================================================================== */
let cards = [];
let ticking = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function smoothstep(t){ t = Math.max(0, Math.min(1, t)); return t*t*(3-2*t); }

function updateReel(){
  const r = reel.getBoundingClientRect();
  const focalY = r.top + r.height * 0.46;      // the focal line (matches .focal-glow)
  const falloff = r.height * 0.42;             // distance over which a flask fades out
  let best = null, bestD = Infinity;

  for (const c of cards){
    if (c.classList.contains('collapsed')) continue;
    const b = c.getBoundingClientRect();
    const cy = b.top + b.height/2;
    const dist = cy - focalY;
    const n = smoothstep(Math.abs(dist) / falloff);

    const inner = c.firstElementChild;
    const scale = 1 - n * 0.30;                // focused ≈1.0 → edges ≈0.70
    const op    = 1 - n * 0.62;                // edges fade to ~0.38
    const tx    = (dist / falloff) * 9;        // slight lateral drift = "a current"
    inner.style.setProperty('--s', scale.toFixed(3));
    inner.style.setProperty('--o', Math.max(.3, op).toFixed(3));
    inner.style.setProperty('--tx', tx.toFixed(1) + 'px');

    // glow: brightest at focus, parallaxes opposite to the drift
    const glow = inner.querySelector('.glow');
    if (glow){
      glow.style.setProperty('--go', (0.6 - n*0.5).toFixed(3));
      glow.style.setProperty('--pg', (-dist * 0.05).toFixed(1) + 'px');
    }

    const ad = Math.abs(dist);
    if (ad < bestD){ bestD = ad; best = c; }
  }

  // exactly one flask is the magnified, detailed one
  for (const c of cards) c.classList.toggle('focused', c === best);
}

reel.addEventListener('scroll', () => {
  if (reduce){ updateReel(); return; }
  if (!ticking){ ticking = true; requestAnimationFrame(() => { updateReel(); ticking = false; }); }
}, { passive:true });
window.addEventListener('resize', updateReel);

// scroll a given card to the focal centre
function centerOn(c){
  const r = reel.getBoundingClientRect();
  const b = c.getBoundingClientRect();
  const delta = (b.top + b.height/2) - (r.top + r.height*0.46);
  reel.scrollBy({ top: delta, behavior: reduce ? 'auto' : 'smooth' });
}

/* =====================================================================
   5 · ACCIO — summon bar slides from top, re-filters the SAME reel live
   ===================================================================== */
const summon = document.getElementById('summon');
const accio  = document.getElementById('accio');
const sInput = document.getElementById('summon-input');
const sHint  = document.getElementById('summon-hint');

function openSummon(){
  accio.classList.add('summoning');
  summon.classList.add('open');
  setTimeout(() => accio.classList.remove('summoning'), 600);
  // ready to type immediately
  setTimeout(() => sInput.focus(), reduce ? 0 : 160);
}
function closeSummon(){
  summon.classList.remove('open');
  sInput.value = '';
  filterReel('');
  sInput.blur();
}
accio.addEventListener('click', () => summon.classList.contains('open') ? closeSummon() : openSummon());
document.getElementById('summon-close').addEventListener('click', closeSummon);

function filterReel(q){
  q = q.trim().toLowerCase();
  let shown = 0;
  for (const c of cards){
    const hit = !q || c.dataset.text.includes(q);
    c.classList.toggle('collapsed', !hit);
    if (hit) shown++;
  }
  // after the collapse animation re-settles, repaint falloff + re-centre
  requestAnimationFrame(updateReel);
  setTimeout(updateReel, 60);
  setTimeout(() => {
    const firstVisible = cards.find(c => !c.classList.contains('collapsed'));
    if (firstVisible && q) centerOn(firstVisible);
    updateReel();
  }, 240);

  sHint.innerHTML = q
    ? `<span class="count">${shown}</span> ${shown===1?'memory':'memories'} surfaced`
    : 'Speak or type — the reel narrows as you go.';
}
sInput.addEventListener('input', () => filterReel(sInput.value));

/* speech-to-search (simulated) */
const sMic = document.getElementById('summon-mic');
sMic.addEventListener('click', () => {
  if (sMic.classList.contains('live')) return;
  sMic.classList.add('live');
  sHint.textContent = 'Listening…';
  sInput.placeholder = 'Listening…';
  setTimeout(() => {
    sMic.classList.remove('live');
    sInput.value = 'courage';
    sInput.placeholder = 'Summon a memory…';
    filterReel('courage');
  }, reduce ? 300 : 1500);
});

/* =====================================================================
   6 · WAND — capture. Opens a clean Apple-Notes-style editor.
   ===================================================================== */
const editor  = document.getElementById('editor');
const edTitle = document.getElementById('ed-title');
const edText  = document.getElementById('ed-text');

function openEditor(preset){
  edTitle.textContent = preset ? preset.t : '';
  edText.textContent  = preset ? preset.s : '';
  editor.classList.add('open');
  setTimeout(() => (preset ? edText : edText).focus(), reduce ? 0 : 320);
}
function openFromCard(c){
  const title = c.querySelector('.title').textContent;
  const snip  = c.querySelector('.snippet').textContent;
  openEditor({ t:title, s:snip });
}
document.getElementById('wand').addEventListener('click', () => openEditor(null));
document.getElementById('ed-cancel').addEventListener('click', () => editor.classList.remove('open'));

/* speech-to-text in the editor (simulated) */
const edMic = document.getElementById('ed-mic');
const DICTATION = "I don't want to lose how today felt — ordinary and enough. ";
edMic.addEventListener('click', () => {
  if (edMic.classList.contains('live')) return;
  edMic.classList.add('live');
  const before = edText.textContent;
  let i = 0;
  const type = () => {
    if (i <= DICTATION.length){
      edText.textContent = before + DICTATION.slice(0, i);
      placeCaretEnd(edText);
      i += 2;
      setTimeout(type, reduce ? 0 : 36);
    } else { edMic.classList.remove('live'); }
  };
  if (reduce){ edText.textContent = before + DICTATION; edMic.classList.remove('live'); }
  else type();
});
function placeCaretEnd(el){
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* POUR — the save moment: a flask fills, then it joins the reel on top */
const pourStage = document.getElementById('pour-stage');
const pourFlask = document.getElementById('pour-flask');
document.getElementById('ed-pour').addEventListener('click', () => {
  const title = (edTitle.textContent || 'Untitled thought').trim();
  const body  = (edText.textContent  || '').trim();
  const len   = (title.length + body.length);
  const hueKeys = ['--h-blue','--h-purple','--h-green','--h-pink','--h-orange','--h-yellow','--h-red'];
  const note = {
    t: title,
    s: body || 'Poured without words — kept anyway.',
    d: 'Just now',
    hue: hueKeys[Math.floor(Math.random()*hueKeys.length)],
    shape: SHAPES[Math.floor(Math.random()*SHAPES.length)],
    fill: Math.max(.2, Math.min(.9, len / 220))
  };

  // play the pour: a flask filling up
  pourFlask.innerHTML = flaskSVG(note.shape, note.hue, 0.05);
  pourStage.classList.add('show');
  const liquid = pourFlask.querySelector('rect');
  if (liquid && !reduce){
    liquid.style.transition = 'y 1s cubic-bezier(.4,0,.2,1), height 1s cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(() => {
      const top = 134 - note.fill*118;
      liquid.setAttribute('y', top);
      liquid.setAttribute('height', 146);
    });
  }

  setTimeout(() => {
    pourStage.classList.remove('show');
    editor.classList.remove('open');
    MEMORIES.unshift(note);                 // newest memory floats to the top
    renderReel(MEMORIES);
    reel.scrollTop = 0; updateReel();
    showToast('Poured into a flask', true);
  }, reduce ? 200 : 1500);
});

/* =====================================================================
   7 · SYNC — cast as a spell (runes + ripples + gold settle)
   ===================================================================== */
const spell   = document.getElementById('spell');
const syncBtn = document.getElementById('sync-btn');
syncBtn.addEventListener('click', () => {
  if (syncBtn.classList.contains('casting')) return;
  syncBtn.classList.add('casting');
  spell.classList.add('cast');
  showToast('Casting sync…', false);
  setTimeout(() => {
    syncBtn.classList.remove('casting');
    spell.classList.remove('cast');
    showToast('14 memories synced to the Basin', true);
  }, reduce ? 500 : 2200);
});

/* =====================================================================
   8 · TOAST
   ===================================================================== */
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toast-msg');
let toastTimer;
function showToast(msg, gold){
  toastMsg.textContent = msg;
  toast.classList.toggle('gold', !!gold);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* =====================================================================
   9 · BOOT
   ===================================================================== */
renderReel(MEMORIES);
// settle the reel on the top memory
requestAnimationFrame(() => { reel.scrollTop = 0; updateReel(); });
</script>
