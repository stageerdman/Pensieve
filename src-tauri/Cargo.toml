[package]
name = "pensieve"
version = "0.1.0"
description = "Pensieve — one place to log all thoughts and memories"
authors = ["Pensieve"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
# OS keychain (macOS Keychain) for the OneDrive refresh token + Azure app config.
keyring = { version = "3", features = ["apple-native"] }
