[package]
name = "pensieve"
version = "0.1.0"
description = "Pensieve — one place to log all thoughts and memories"
authors = ["Pensieve"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset: enables the asset: custom protocol so convertFileSrc() URLs load vault
# media in the webview (scoped to $APPDATA/vault/media in tauri.conf.json).
tauri = { version = "2.11.6", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
# Menu-bar mode: global hotkeys (⌘⇧N / ⌘⇧A) fire even when Pensieve isn't focused.
tauri-plugin-global-shortcut = "2"
# Native-side HTTP so OAuth token + Graph calls carry no browser Origin header
# (the webview's Origin triggers Microsoft's CORS/AADSTS90023 on the token endpoint).
ureq = "2"
# Image bytes cross the invoke boundary as base64 (a JS number array over IPC is slow for
# image-sized payloads); write_bytes/read_bytes (de)code here.
base64 = "0.22"
# PATRONUS-AI: the Pensieve MCP server (mcp/server.rs) this app's own binary re-execs
# into, and the tokio runtime it needs to drive rmcp's stdio transport. Scoped to that
# one code path — the rest of the app stays sync/blocking as it already was.
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
schemars = "1.0"
# AGENT-RAG: per-agent local knowledge files (ported from masters-wheel's
# src-tauri/src/knowledge/). fastembed embeds text on-device (no API key, no network);
# rusqlite+sqlite-vec store the vectors in the same "plain file on disk" style as the
# rest of the vault; pdf-extract reads .pdf knowledge files.
fastembed = "7.5.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sqlite-vec = "0.1.9"
pdf-extract = "0.12.1"
# AGENT-RAG: native "pick knowledge files" dialog for the Agents editor.
tauri-plugin-dialog = "2.8.4"
